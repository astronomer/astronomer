description: >-
  PINF-1035 + PINF-1109: creates one real Airflow Deployment through Houston and exercises its
  lifecycle (executor switch, CeleryExecutor to KubernetesExecutor). The deployment is a git_sync
  relay with no global.privateCaCerts, so TC-CA-05a can assert the relay carries no private-CA wiring
  when the feature is off -- the feature-OFF counterpart to the git-sync-private-ca scenario. git-sync
  is already enabled by the base configs/local-dev.yaml, so no per-scenario enable overlay is needed.
topology: unified
# The one deployment runs the git-sync relay throughout, so the relay pods plus the
# reduce-resources overlay push past the default xlarge node; 2xlarge matches the other
# deployment-creating scenarios (see auth-sidecar / PINF-1080).
resource_class: 2xlarge
values:
  - configs/scenario-airflow-reduce-resources.yaml
