description: >-
  Validates that Laminar's api-server and hypervisor still come up and stay Ready while a live
  Kyverno admission controller is evaluating every pod the cluster admits. The platform chart is
  installed before Kyverno exists, so the pods the install creates are never seen by the admission
  webhook -- the scenario's own tests therefore roll both Laminar Deployments once Kyverno is live,
  which is the only point at which their pod specs actually pass through admission, and then assert
  that Kyverno evaluated the resulting pods rather than matching nothing.
topology: unified
# The platform plus Laminar's own three pods (api-server x2 at 400m each, hypervisor x1 at 200m),
# with both Deployments rolled a second time mid-test. xlarge was already reported as marginal for
# the platform alone in PINF-1080.
resource_class: 2xlarge
# Runs this scenario's tests against a real, live Kyverno admission controller, installed audit-only
# (bin/install-kyverno-scan.py / bin/report-kyverno-scan.py, PINF-1034). The CI job installs it
# *between* bin/run-scenario.py and pytest -- run-scenario.py does not, so a bare local run leaves
# Kyverno absent and the Kyverno-dependent tests skip themselves.
kyverno_scan: true
ci: true
# quay.io/astronomer/ap-laminar is a private repository, so the node cannot pull it; this sideloads
# the image before the kubelet looks for it. The tag MUST match charts/laminar/values.yaml's
# images.laminar.tag -- a mismatch lands the pod in ImagePullBackOff. Pull it first, on a host that
# is logged in: docker login quay.io && docker pull quay.io/astronomer/ap-laminar:1.0.0-rc4
pre_helm_scripts:
  - bin/kind-load-images.py --cluster unified quay.io/astronomer/ap-laminar:1.0.0-rc4
values:
  - configs/enable-laminar.yaml
  # Laminar touches nothing in the in-cluster Elasticsearch stack, which is three heavy pods and a
  # large source of unrelated failures. Also mandatory on Apple Silicon: ap-elasticsearch is
  # amd64-only and its JVM cannot install a seccomp filter under Rosetta.
  - configs/disable-logging.yaml
namespace_labels:
  # Every policy bin/install-kyverno-scan.py applies matches only namespaces carrying this label.
  # The chart never labels the platform namespace it installs into, and Laminar runs in exactly that
  # namespace -- without this, Kyverno would evaluate zero Laminar pods and report a clean result it
  # never earned. configs/enable-kyverno-scan.yaml is deliberately not used: it labels the
  # namespaces Commander creates per Airflow Deployment, and this scenario creates none.
  platform: astronomer
