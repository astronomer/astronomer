description: >-
  PINF-1109: validates the PINF-774 private-CA trust path for git-sync end to end. git-sync-relay
  clones over HTTPS+PAT from an in-cluster Forgejo host whose TLS cert is signed by a private CA the
  platform trusts via global.privateCaCerts, plus commander's config-time credential validation
  (FR4.3) against that host. setup-forgejo-ca.py runs pre-helm so the CA Secret exists before
  commander mounts global.privateCaCerts at install; the test fixture then deploys Forgejo and seeds
  a repo + PAT.
topology: unified
# One Airflow Deployment (git-sync) plus the platform chart and Forgejo; sized to 2xlarge
# to stay clear of the FailedScheduling ceiling seen on xlarge (see auth-sidecar / PINF-1080),
# with the airflow resource-reduce overlay for the same reason.
resource_class: 2xlarge
pre_helm_scripts:
  # Namespaces are passed explicitly and have no defaults, so the script aborts (rather than
  # touching whatever cluster KUBECONFIG points at) if run by hand without them.
  - bin/setup-forgejo-ca.py --platform-namespace astronomer --forgejo-namespace git-forgejo
values:
  - configs/enable-git-sync-private-ca.yaml
  - configs/scenario-airflow-reduce-resources.yaml
