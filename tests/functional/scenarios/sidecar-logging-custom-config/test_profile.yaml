description: >-
  Verifies the Houston loggingSidecar is wired correctly when enabled with a CUSTOM config
  (global.logging.loggingSidecar.customConfig: true). In that mode Houston injects the
  log-shipping sidecar into each Airflow deployment pod and mounts its config from a Secret named
  "sidecar-config" (fixed name) in the deployment's namespace, instead of the default per-release
  ConfigMap "<releaseName>-sidecar-config". The scenario creates a real Airflow Deployment through
  Houston (as dag_deploy, then switched to git_sync), provisions that Secret (Houston references but
  does not create it), and asserts every injected pod -- including the DagDeployment-specific
  dag-server and git-sync-relay pods -- carries the sidecar and mounts the Secret, and that the
  default ConfigMap is NOT created.
topology: unified
# Creates a real Airflow Deployment and switches its DagDeployment type (dag_deploy ->
# git_sync) so both dag-server and git-sync-relay pods exist; that plus the platform chart
# matches the CPU footprint of the other deployment-creating scenarios (auth-sidecar /
# deployment-lifecycle), which need 2xlarge to avoid FailedScheduling.
resource_class: 2xlarge
values:
  - configs/enable-logging-sidecar-custom-config.yaml
