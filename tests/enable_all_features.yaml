astronomer:
  dpLink:
    enabled: true
  flightDeck:
    enabled: true
  pilot:
    enabled: true
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi
  navigator:
    enabled: true
  # mcpServer is deliberately NOT enabled here: this fixture also sets global.authSidecar.enabled
  # (below), and mcpServer.enabled + authSidecar.enabled is an unsupported combination that fails
  # the render outright (APC-1768, mcp-server-ingress.yaml). mcpServer has its own dedicated
  # coverage in tests/chart_tests/test_mcp_server.py instead.
  houston:
    logging:
      loggingSidecar:
        enabled: true
        elasticsearch:
          enabled: true
          endpoint: "https://es.example.com:9200"
    cleanupAirflowDb:
      enabled: true
    cleanupClusterAudits:
      enabled: true
    cleanupDeployRevisions:
      enabled: true
    cleanupDeployments:
      enabled: true
    updateCheck:
      enabled: true
    updateRuntimeCheck:
      enabled: true
    upgradeDeployments:
      enabled: true
    worker:
      enabled: true
global:
  airflowOperator:
    enabled: true
  authSidecar:
    enabled: true
  baseDomain: foo.com
  customLogging:
    awsSecretName: dummy
    enabled: true
  customRBAC:
    enabled: true
  dataPlaneFailover:
    enabled: true
    externalSecretManagerName: dummy-esm-name
  networkPolicy:
    enabled: true
  rbac:
    enabled: true
  namespaceManagement:
    namespaceFreeFormEntry:
      enabled: true
  metricsReporting:
    taskUsageMetrics:
      enabled: true
  deploymentLifecycle:
    deployRollback:
      enabled: true
      dagTarballVersionValidation:
        enabled: true
  deployMechanisms:
    dagOnlyDeployment:
      enabled: true
  laminar:
    enabled: true
  logging:
    loggingSidecar:
      enabled: true
  pgbouncer:
    enabled: true
  podDisruptionBudgets:
    enabled: true
  postgresql:
    enabled: true
  privateCaCertsAddToHost:
    addToContainerd: true
    enabled: true
  prometheusPostgresExporter:
    enabled: true
  nodeExporter:
    enabled: true
nats:
  nats:
    exporter:
      enabled: true
    reloader:
      enabled: true
    jetStream:
      enabled: true
external-secrets:
  enabled: true
postgresql:
  replication:
    enabled: true
  postgresqlRunPermissions:
    enabled: false
