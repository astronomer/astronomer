worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
error_log /dev/stdout info;
env ES_SECRET;
env ES_SECRET_NAME;

http {
  log_format cache_status '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          'cache=$auth_cache_status';
  access_log /dev/stdout cache_status;
  client_max_body_size 1024M;
  proxy_cache_path /tmp/nginx-auth-cache levels=1:2 keys_zone=auth_cache:10m max_size=100m inactive=5m;

  # A request with neither an Authorization header nor a cookie has no credential to key a cached answer on, so
  # its answer must not be stored or served from the cache (see proxy_cache_bypass in /auth below).
  map "$http_authorization$http_cookie" $es_auth_uncacheable {
    default 0;
    "" 1;
  }

  upstream external_es {
    server esdemo.example.com:443;
  }

  # Authenticated port: the one the public Ingress and Airflow's sidecars use.
  server {
    listen 9200;
    auth_request /auth;
    auth_request_set $auth_cache_status $upstream_cache_status;
    proxy_http_version 1.1;
    proxy_set_header Connection "Keep-Alive";
    proxy_set_header Proxy-Connection "Keep-Alive";

    # The index is built from the authorized scope ($es_scope), never from the request URL. It is used in proxy_pass, not a rewrite.
    auth_request_set $es_scope $upstream_http_x_elasticsearch_index_scope;

    # The following "location" rules limit callers to only their indices. Any further
    # additions should follow this pattern.
    location ~* /_count$ {          
      access_by_lua_file /usr/local/openresty/nginx/conf/setenv.lua;
      proxy_set_header Host esdemo.example.com:443;
      proxy_ssl_name esdemo.example.com;
      proxy_pass https://external_es/fluentd.$es_scope.*/_count$is_args$args;
      proxy_ssl_verify off;
    }

    location ~* /_bulk$ {          
      access_by_lua_file /usr/local/openresty/nginx/conf/setenv.lua;
      proxy_set_header Host esdemo.example.com:443;
      proxy_ssl_name esdemo.example.com;
      proxy_pass https://external_es/fluentd.$es_scope.*/_bulk$is_args$args;
      proxy_ssl_verify off;
    }

    location ~* /_search$ {          
      access_by_lua_file /usr/local/openresty/nginx/conf/setenv.lua;
      proxy_set_header Host esdemo.example.com:443;
      proxy_ssl_name esdemo.example.com;
      proxy_pass https://external_es/fluentd.$es_scope.*/_search$is_args$args;
      proxy_ssl_verify off;
    }

    location = /auth {
      internal;
      proxy_cache auth_cache;
      # Keyed on credential, cookie, host and URI, since the authorization answer can differ by each.
      proxy_cache_key "$http_authorization|$http_cookie|$host|$request_uri";
      proxy_cache_bypass $es_auth_uncacheable;
      proxy_no_cache $es_auth_uncacheable;
      proxy_cache_valid 200 5m;
      proxy_cache_valid 401 403 1m;
      proxy_ignore_headers Cache-Control Expires;
      add_header X-Auth-Cache-Status $upstream_cache_status always;
      proxy_pass http://release-name-houston.default:8871/v2/elasticsearch;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      # The original URL, host included. The control plane's ingress overwrites X-Original-URI.
      proxy_set_header X-ES-Original-URI $scheme://$host$request_uri;
    }

    location = /_cluster/state/version {          
      access_by_lua_file /usr/local/openresty/nginx/conf/setenv.lua;
      proxy_pass https://esdemo.example.com:;
      proxy_ssl_verify off;
    }

    location = /_cluster/health {          
      access_by_lua_file /usr/local/openresty/nginx/conf/setenv.lua;
      proxy_pass https://esdemo.example.com:;
      proxy_ssl_verify off;
    }

    location ~ ^/ {
      deny all;
    }
  }

  # Unauthenticated, in-cluster only: the Vector DaemonSet has no credentials, so this port injects the stored
  # one. The NetworkPolicy admits only Vector here; it must never be exposed through an Ingress.
  server {
    listen 9201;
    proxy_http_version 1.1;
    proxy_set_header Connection "Keep-Alive";
    proxy_set_header Proxy-Connection "Keep-Alive";

    location ~ ^/ {          
      access_by_lua_file /usr/local/openresty/nginx/conf/setenv.lua;
      proxy_pass https://esdemo.example.com:;
      proxy_ssl_verify off;
    }
  }
}