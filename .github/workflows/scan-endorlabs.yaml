name: "[scan] Endor Labs CVE scan"
run-name: "Endor Labs scan${{ inputs.image-override && format(': {0}', inputs.image-override) || '' }}"

on:
  schedule:
    - cron: "0 7 * * 1" # Weekly, Monday 07:00 UTC (offset an hour from astro-agent's own scan to avoid both hitting Endor's upsert path at once)
  workflow_dispatch:
    inputs:
      image-override:
        description: "Fully-qualified image ref to scan (e.g. quay.io/astronomer/ap-commander:2.2.1). Blank = scan the full catalog matrix."
        required: false
  pull_request:
    paths:
      - .github/workflows/scan-endorlabs.yaml
      - bin/build-endor-scan-matrix.py

permissions:
  contents: read
  id-token: write

# Endor Labs is sensitive to concurrent finding upserts into the same project
# (astro-agent's own copy of this workflow has seen tag-indexed findings go missing
# intermittently when many matrix cells write at once). Serialize across workflow runs
# so two cron / dispatch / PR triggers don't fight each other.
concurrency:
  group: endorlabs-scan
  cancel-in-progress: false

jobs:
  build-matrix:
    name: Build scan target matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - id: build
        name: Build matrix
        env:
          IMAGE_OVERRIDE: ${{ inputs.image-override }}
        run: |
          matrix=$(bin/build-endor-scan-matrix.py | tee -a "$GITHUB_STEP_SUMMARY")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  scan:
    name: ${{ matrix.name }}
    needs: build-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Serialize: concurrent finding upserts into the shared Endor project have shown
      # intermittent indexing dropouts (see the concurrency block above). Each cell runs
      # after the previous one finishes.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.build-matrix.outputs.matrix) }}
    steps:
      # astronomer/astronomer is a public repo, and GitHub Actions will not resolve a
      # `uses: owner/repo/path@ref` reference into a private/internal repo's action from a
      # public repo's workflow, no matter what access is granted — that restriction is
      # unconditional, unlike for private/internal repos referencing each other (which is
      # how astro-agent's own copy of this workflow gets away with referencing
      # astronomer/actions directly). So we mint a scoped token via Octo STS (trust policy:
      # astronomer/.github's .github/chainguard/astronomer-image-scan.sts.yaml), check out
      # astronomer/actions with it, and reference the composite action by local path instead
      # of the remote owner/repo@ref syntax that public repos can't use here.
      #
      # This has to be the public octo-sts/action directly, not astronomer/actions' own
      # octo-sts-token wrapper — that wrapper lives in the same private repo we're trying to
      # reach, so it would hit the identical resolution wall.
      - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: octo-sts
        with:
          scope: astronomer
          identity: astronomer-image-scan

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: astronomer/actions
          ref: main
          token: ${{ steps.octo-sts.outputs.token }}
          path: .astronomer-actions
          persist-credentials: false

      # Every catalog image is public on quay.io, so no registry login is needed before
      # `docker pull` — unlike astro-agent's version of this workflow, which scans
      # private ACR/CP-prod images.
      - name: Endor Labs scan
        id: scan
        uses: ./.astronomer-actions/.github/actions/endorlabs-image-scan
        with:
          image: ${{ matrix.ref }}

      # Report-only: findings land in Endor's UI for triage, nothing here fails the
      # build. If this repo later wants a blocking release gate, wire
      # steps.scan.outputs.has-relevant-findings into a required check instead.
      - name: Record result in job summary
        if: always()
        run: |
          echo "- \`${{ matrix.ref }}\`: has-relevant-findings=${{ steps.scan.outputs.has-relevant-findings }}" >> "$GITHUB_STEP_SUMMARY"
