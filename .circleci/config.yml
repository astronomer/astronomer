workflows:
  version: 2.1

  build-and-release-helm-chart:
    when:
      not: << pipeline.parameters.qa-release >>
    jobs:
      - run_pre_commit
      - test-unit
      - check-commander-airflow-version
      - build-artifact:
          requires:
            - check-commander-airflow-version
            - run_pre_commit
            - test-unit
      - approve-test-all-platforms:
          type: approval

      - scenario-unified-1-31-14:
          requires:
            - build-artifact
      - scenario-unified-1-32-11:
          requires:
            - build-artifact
            - approve-test-all-platforms

      - scenario-unified-1-33-7:
          requires:
            - build-artifact
            - approve-test-all-platforms

      - scenario-unified-1-34-3:
          requires:
            - build-artifact
            - approve-test-all-platforms

      - scenario-unified-1-35-1:
          requires:
            - build-artifact

      # Manual gate for the custom functional scenarios on non-release branches.
      # On master and release-X.Y they run automatically (below) and gate the
      # release; on every other branch they wait on this approval before running.
      - approve-scenarios:
          type: approval
          filters:
            branches:
              ignore:
                - master
                - '/^release-\d+\.\d+$/'

      # master + release-X.Y: run automatically, and gate release-to-internal.
      - scenario-auth-sidecar:
          requires:
            - build-artifact
          context:
            - github-repo
          filters:
            branches:
              only:
                - master
                - '/^release-\d+\.\d+$/'
      # every other branch: gated behind the manual approve-scenarios approval. This
      # instance MUST have a distinct name from the auto instance above -- CircleCI
      # rejects two jobs sharing a name in one workflow even when their branch filters
      # are mutually exclusive. The auto instance keeps the plain name so release-to-internal
      # can require it on release branches.
      - scenario-auth-sidecar:
          name: scenario-auth-sidecar-approved
          requires:
            - build-artifact
            - approve-scenarios
          context:
            - github-repo
          filters:
            branches:
              ignore:
                - master
                - '/^release-\d+\.\d+$/'
      # master + release-X.Y: run automatically, and gate release-to-internal.
      - scenario-deployment-lifecycle:
          requires:
            - build-artifact
          filters:
            branches:
              only:
                - master
                - '/^release-\d+\.\d+$/'
      # every other branch: gated behind the manual approve-scenarios approval. This
      # instance MUST have a distinct name from the auto instance above -- CircleCI
      # rejects two jobs sharing a name in one workflow even when their branch filters
      # are mutually exclusive. The auto instance keeps the plain name so release-to-internal
      # can require it on release branches.
      - scenario-deployment-lifecycle:
          name: scenario-deployment-lifecycle-approved
          requires:
            - build-artifact
            - approve-scenarios
          filters:
            branches:
              ignore:
                - master
                - '/^release-\d+\.\d+$/'
      # master + release-X.Y: run automatically, and gate release-to-internal.
      - scenario-git-sync-private-ca:
          requires:
            - build-artifact
          filters:
            branches:
              only:
                - master
                - '/^release-\d+\.\d+$/'
      # every other branch: gated behind the manual approve-scenarios approval. This
      # instance MUST have a distinct name from the auto instance above -- CircleCI
      # rejects two jobs sharing a name in one workflow even when their branch filters
      # are mutually exclusive. The auto instance keeps the plain name so release-to-internal
      # can require it on release branches.
      - scenario-git-sync-private-ca:
          name: scenario-git-sync-private-ca-approved
          requires:
            - build-artifact
            - approve-scenarios
          filters:
            branches:
              ignore:
                - master
                - '/^release-\d+\.\d+$/'
      # master + release-X.Y: run automatically, and gate release-to-internal.
      - scenario-git-sync-shared-volume:
          requires:
            - build-artifact
          filters:
            branches:
              only:
                - master
                - '/^release-\d+\.\d+$/'
      # every other branch: gated behind the manual approve-scenarios approval. This
      # instance MUST have a distinct name from the auto instance above -- CircleCI
      # rejects two jobs sharing a name in one workflow even when their branch filters
      # are mutually exclusive. The auto instance keeps the plain name so release-to-internal
      # can require it on release branches.
      - scenario-git-sync-shared-volume:
          name: scenario-git-sync-shared-volume-approved
          requires:
            - build-artifact
            - approve-scenarios
          filters:
            branches:
              ignore:
                - master
                - '/^release-\d+\.\d+$/'
      - approve-stage-cluster-test:
          type: approval
          filters:
            branches:
              only:
                - '/^release-\d+\.\d+$/'
      - build-artifact:
          name: build-artifact-stage-cluster
          qa_release: true
          artifact_subdir: qa
          requires:
            - approve-stage-cluster-test
          filters:
            branches:
              only:
                - '/^release-\d+\.\d+$/'
      - release-to-internal:
          name: release-to-internal-stage-cluster
          artifact_subdir: qa
          context:
            - gcp-astronomer-prod
          requires:
            - build-artifact-stage-cluster
          filters:
            branches:
              only:
                - '/^release-\d+\.\d+$/'
      - trigger-stage-cluster-build:
          artifact_subdir: qa
          split_software_automation_tests: true
          requires:
            - release-to-internal-stage-cluster
          filters:
            branches:
              only:
                - '/^release-\d+\.\d+$/'
      - approve-internal-release:
          type: approval
          filters:
            branches:
              only:
                - '/^release-\d+\.\d+$/'
      - release-to-internal:
          context:
            - gcp-astronomer-prod
          filters:
            branches:
              only:
                - '/^release-\d+\.\d+$/'
          requires:
            - approve-internal-release
            - scenario-unified-1-31-14
            - scenario-unified-1-35-1
            - scenario-auth-sidecar
            - scenario-deployment-lifecycle
            - scenario-git-sync-private-ca
            - scenario-git-sync-shared-volume
      - approve-public-release:
          type: approval
          requires:
            - release-to-internal
            - scenario-unified-1-32-11
            - scenario-unified-1-33-7
            - scenario-unified-1-34-3
          filters:
            branches:
              only:
                - '/^release-\d+\.\d+$/'
      - release-to-public:
          context:
            - gcp-astronomer-prod
            - github-repo
          requires:
            - approve-public-release
          filters:
            branches:
              only:
                - '/^release-\d+\.\d+$/'
      - sign-released-image:
          name: sign-release-image
          context:
            - quay.io
            - docker.io
            - software-cosign-keys
          requires:
            - release-to-public
          filters:
            branches:
              only:
                - '/^release-\d+\.\d+$/'

  release-bom-workflow:
    jobs:
      - release_bom:
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+(-?(rc(\.\d+)?|alpha(\.\d+)?)?)?$/
            branches:
              ignore: /.*/
          context:
            - github-repo
            - gcp-astronomer-prod

  qa-build-and-release-helm-chart:
    when: << pipeline.parameters.qa-release >>
    jobs:
      - build-artifact:
          qa_release: true
      - release-to-internal:
          context:
            - gcp-astronomer-prod
          requires:
            - build-artifact
          filters:
            branches:
              only:
                - '/^release-\d+\.\d+$/'
      - trigger-stage-cluster-build:
          requires:
            - release-to-internal
          filters:
            branches:
              only:
                - '/^release-\d+\.\d+$/'

commands:
  push-to-quay-io:
    description: "Push a Docker image to Quay.io"
    parameters:
      comma_separated_tags:
        type: string
        default: latest
      docker_repository:
        type: string
        default: $DOCKER_REPO
      image_name:
        type: string
        default: $CIRCLE_PROJECT_REPONAME
    steps:
      - setup_remote_docker:
          docker_layer_caching: true
      - attach_workspace:
          at: /tmp/workspace
      - run:
          name: Load archived Docker image
          command: docker load -i /tmp/workspace/<< parameters.image_name >>.tar
      - run:
          name: Login to Quay.io
          command: echo "$QUAY_PASSWORD" | docker login --username "$QUAY_USERNAME" --password-stdin quay.io
      - run:
          name: Push Docker image(s)
          command: |
            set -xe
            function docker_tag_exists() {
                curl --silent -f -lSL "https://quay.io/api/v1/repository/$1/tag/$2/images" > /dev/null
            }
            function tag_and_push() {
                docker tag "<< parameters.image_name >>" "quay.io/astronomer/<< parameters.image_name >>:$1"
                docker push "quay.io/astronomer/<< parameters.image_name >>:$1"
            }
            for tag in $(echo "<< parameters.comma_separated_tags >>" | sed "s/,/ /g");
            do
              # If the tag looks starts with "v" then a digit, remove the "v"
              pattern="^(v[0-9].*)"
              if [[ $tag =~ $pattern ]]; then
                tag="${tag:1}"
              fi
              if docker_tag_exists "<< parameters.docker_repository >>/<< parameters.image_name >>" "${tag}" ; then
                  if [[ "$tag" -eq "latest" ]]; then
                    tag_and_push "$tag"
                  else
                    echo "This docker tag already exists. Skipping the Docker push!"
                  fi
              else
                tag_and_push "$tag"
              fi
            done

  docker-build:
    description: "Build a Docker image"
    parameters:
      dockerfile:
        type: string
        default: Dockerfile
      path:
        type: string
        default: "."
      image_name:
        type: string
        default: $CIRCLE_PROJECT_REPONAME
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Build the Docker image
          command: |
            set -xe
            image_name="<< parameters.image_name >>"
            docker build \
              -t "$image_name" \
              --file << parameters.path>>/<< parameters.dockerfile >> \
              --build-arg BUILD_NUMBER="${CIRCLE_BUILD_NUM}" \
              << parameters.path >>
            docker save -o << parameters.image_name >>.tar "$image_name"
      - persist_to_workspace:
          root: .
          paths:
            - "./<< parameters.image_name >>.tar"

  publish-github-release:
    description: "Create a release on GitHub"
    parameters:
      tag:
        type: string
        default: "$NEXT_TAG"
    steps:
      - run:
          name: Create a release on GitHub
          command: |
            set -xe
            pip install astronomer_e2e_test
            astronomer-ci publish-github-release --github-repository "$CIRCLE_PROJECT_REPONAME" --github-organization "$CIRCLE_PROJECT_USERNAME" --commitish "$CIRCLE_SHA1"
