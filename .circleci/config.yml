# Warning: automatically generated file
# Please edit config.yml.j2, and use the script generate_circleci_config.py
version: 2.1
executors:
  docker-executor:
    environment:
      GIT_ORG: astronomer
    docker:
      - image: cimg/python:3.13

orbs:
  slack: circleci/slack@4.10.1
  cosign: cpanato/cosign-orb@2.0.0

parameters:
  qa-release:
    type: boolean
    default: false
    description: "This will trigger QA release workflow."

jobs:
  sign-released-image:
    docker:
      - image: quay.io/astronomer/ci-helm-release:2026-09
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
          version: docker28
      - cosign/install:
          version: "v2.5.0"
      - run:
          name: Login to docker registry
          command: |
            echo "$DOCKER_PASSWORD" | docker login --username $DOCKER_USERNAME --password-stdin docker.io
            echo "$QUAY_PASSWORD" | docker login --username $QUAY_USERNAME --password-stdin quay.io
      - run:
          name: Set image tag to sign
          command: |
            set -xe
            # Only sign tagged releases or specific QA releases
            # For regular release job
            if [ -n "$NEXT_TAG" ]; then
              echo "export IMAGE_TAG=$NEXT_TAG" >> $BASH_ENV
            # For custom QA release job
            elif [ -n "$IMG_TAG" ]; then
              echo "export IMAGE_TAG=$IMG_TAG" >> $BASH_ENV
            else
              echo "No specific release tag found, skipping image signing"
              exit 0
            fi
      - run:
          name: Install Python dependencies
          command: pip install requests
      - run:
          name: Sign Docker images with cosign
          command: |
            # Execute the signing script with version from environment
            python bin/sign-images.py --version "${IMAGE_TAG}"

  release_bom:
    docker:
      - image: quay.io/astronomer/ci-helm-release:2026-09
    steps:
      - checkout
      - run:
          name: Run Release BOM Script
          command: |
            bin/release-bom -x ${CIRCLE_TAG}

  run_pre_commit:
    docker:
      - image: quay.io/astronomer/ci-pre-commit:2026-09
    resource_class: small
    steps:
      - checkout
      - run:
          name: Create pre-commit-cache-key.txt
          command: |
            cp .pre-commit-config.yaml /tmp/pre-commit-cache-key.txt
      - restore_cache:
          keys:
            - pre-commit-cache-{{ checksum "/tmp/pre-commit-cache-key.txt" }}
      - run:
          name: Install pre-commit hooks
          command: pre-commit install-hooks
      - save_cache:
          key: pre-commit-cache-{{ checksum "/tmp/pre-commit-cache-key.txt" }}
          paths:
            - ~/.cache/pre-commit
      - run:
          name: Run pre-commit
          command: pre-commit run --all-files --show-diff-on-failure

  test-unit:
    docker:
      - image: quay.io/astronomer/ci-helm-release:2026-09
    # https://circleci.com/docs/using-docker/#x86
    resource_class: large
    parallelism: 5
    steps:
      - checkout
      - run:
          name: Create venv-cache-key.txt
          command: |
            cp uv.lock /tmp/uv-lock-cache-key.txt
      - restore_cache:
          keys:
            - test-venv-{{ checksum "/tmp/uv-lock-cache-key.txt" }}
      - run:
          name: Create venv
          command: |
            make venv
      - save_cache:
          key: test-venv-{{ checksum "/tmp/uv-lock-cache-key.txt" }}
          paths:
            - ~/.cache/uv
            - ~/.local/share/uv
            - ~/project/.venv
      - run:
          name: unittest the Astronomer chart
          command: |
            mkdir test-results
            TEST_FILES=$(circleci tests glob "tests/chart_tests/test_*.py" | circleci tests split --split-by=timings)
            echo "TEST_FILES=\"$TEST_FILES\""
            uv run pytest -v --junitxml=test-results/junit.xml -n auto $TEST_FILES
      - store_test_results:
          path: test-results

  build-artifact:
    docker:
      - image: quay.io/astronomer/ci-helm-release:2026-09
    parameters:
      qa_release:
        type: boolean
        default: false
      artifact_subdir:
        type: string
        default: "."
    steps:
      - checkout
      - run:
          name: Package the Astronomer chart
          command: |
            bin/install-ci-tools.py
            bin/build-helm-chart.sh << parameters.qa_release >> << parameters.artifact_subdir >>
      - persist_to_workspace:
          root: "."
          paths:
            - "<< parameters.artifact_subdir >>/*.tgz"

  release-to-internal:
    docker:
      - image: quay.io/astronomer/ci-helm-release:2026-09
    parameters:
      artifact_subdir:
        type: string
        default: "."
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - checkout
      - run:
          name: Release the Astronomer chart to internal
          command: |
            set -e
            bin/release-helm-chart /tmp/workspace/<< parameters.artifact_subdir >>/astronomer-*.tgz

  trigger-stage-cluster-build:
    executor: docker-executor
    resource_class: small
    parameters:
      artifact_subdir:
        type: string
        default: "."
      split_software_automation_tests:
        type: boolean
        default: false
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - checkout
      - run:
          name: Triggering update to stage cluster
          command: |
            set -e
            args=(--astro_path=/tmp/workspace/<< parameters.artifact_subdir >> --circleci_token=$CIRCLECI_API_KEY_TEST --branch=$CIRCLE_BRANCH)
            if [ "<< parameters.split_software_automation_tests >>" = "true" ]; then
              args+=(--split_software_automation_tests)
            fi
            bin/trigger_stage_cluster_update.py "${args[@]}"

  release-to-public:
    docker:
      - image: quay.io/astronomer/ci-helm-release:2026-09
    steps:
      - attach_workspace:
          at: /tmp/workspace
      - checkout
      - run:
          name: Release the Astronomer chart to prod
          command: |
            bin/release-helm-chart -p /tmp/workspace/astronomer-*.tgz
      - publish-github-release

