# When adding a new version, look up the most recent patch version on Dockerhub
# https://hub.docker.com/r/kindest/node/tags
test_k8s_versions:
  - 1.31.14
  - 1.32.11
  - 1.33.7
  - 1.34.3
  - 1.35.1
  - 1.36.4
  - 1.37.0
tools:
  helm:
    version: 3.22.1
    url: https://github.com/helm/helm
  # Only used by bin/setup-istio.py (the istio-gateway scenario's pre-helm step), which
  # installs the base/istiod/gateway charts at this version. Not downloaded by
  # bin/install-ci-tools.py -- there is no istioctl in the helper bin dir.
  istio:
    version: 1.30.7
    url: https://github.com/istio/istio
  kind:
    version: 0.33.0
    url: https://github.com/kubernetes-sigs/kind
  mkcert:
    version: 1.4.4
    url: https://github.com/FiloSottile/mkcert
  stern:
    version: 1.33.1
    url: https://github.com/stern/stern
