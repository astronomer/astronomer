####################################
## Houston Airflow-proxy Ingress  ##
####################################
# Separate ingress for the path-allowlisted Airflow proxy API so its JSON 404
# error envelopes pass through untouched. The main Houston ingress sets
# custom-http-errors: "404", which makes nginx replace any upstream 404 body
# with the branded default-backend page; that annotation is ingress-scoped, so
# the only way to exempt this path is a dedicated ingress without it.
{{- if .Values.global.baseDomain }}
{{- if eq (include "global.ingress.enabled" .) "true" }}
{{- if eq (include "astronomer.controlPlaneEnabled" .) "true" }}
kind: Ingress
apiVersion: {{ template "apiVersion.Ingress" . }}
metadata:
  name: {{ .Release.Name }}-houston-airflow-proxy-ingress
  labels:
    component: houston-airflow-proxy-ingress
    tier: astronomer
    release: {{ .Release.Name }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    heritage: {{ .Release.Service }}
    plane: {{ .Values.global.plane.mode }}
  annotations:
    {{- if .Values.global.authSidecar.enabled  }}
{{- toYaml .Values.global.extraAnnotations | nindent 4 }}
    {{- else }}
    kubernetes.io/ingress.class: "{{ .Release.Name }}-nginx"
    {{- if .Values.global.extraAnnotations }}
{{- toYaml .Values.global.extraAnnotations | nindent 4 }}
    {{- end }}
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    {{- end }}

    {{- if .Values.houston.ingress.annotation  }}
    {{- toYaml .Values.houston.ingress.annotation  | nindent 4  }}
    {{- end }}
spec:
  {{- if .Values.global.tlsSecret }}
  tls:
    - secretName: {{ .Values.global.tlsSecret }}
      hosts:
        - houston.{{ .Values.global.baseDomain }}
        {{- if .Values.global.controlPlaneHA.enabled }}
        - houston.{{ .Values.global.controlPlaneHA.globalBaseDomain }}
        {{- end }}
  {{- end }}
  rules:
  - host: houston.{{ .Values.global.baseDomain }}
    http:
      paths:
        - path: ^/v1/deployments/[^/]+/airflow/
          pathType: ImplementationSpecific
          backend:
            service:
              name: {{ .Release.Name }}-houston
              port:
                name: houston-http
  {{- if .Values.global.controlPlaneHA.enabled }}
  - host: houston.{{ .Values.global.controlPlaneHA.globalBaseDomain }}
    http:
      paths:
        - path: ^/v1/deployments/[^/]+/airflow/
          pathType: ImplementationSpecific
          backend:
            service:
              name: {{ .Release.Name }}-houston
              port:
                name: houston-http
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
