#####################################
## Houson Bootstrap ServiceAccount ##
#####################################
{{- if and .Values.houston.serviceAccount.create .Values.global.rbac.enabled  (and (not .Values.houston.backendSecretName) (not .Values.houston.backendConnection)) }}
{{- if eq (include "astronomer.controlPlaneEnabled" .) "true" }}
kind: ServiceAccount
apiVersion: v1
automountServiceAccountToken: {{ .Values.houston.serviceAccount.automountServiceAccountToken }}
metadata:
  name: {{ template "houston.bootstrapperServiceAccountName" . }}
  labels:
    tier: houston
    release: {{ .Release.Name }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    heritage: {{ .Release.Service }}
    plane: {{ .Values.global.plane.mode }}
  annotations:
  {{- with .Values.houston.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{ if .Values.global.argoCD.annotation.enabled }}
    argocd.argoproj.io/sync-wave: "-1"
  {{- end }}
{{- end }}
{{- end }}
