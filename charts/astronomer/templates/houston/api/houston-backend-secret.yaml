###############################
## Houston Bootstrap Secrets ##
###############################
{{- if or (eq .Values.global.plane.mode "control") (eq .Values.global.plane.mode "unified") }}
{{- if and (not .Values.houston.backendSecretName) (not .Values.houston.backendConnection) }}
kind: Secret
apiVersion: v1
metadata:
  name: {{ template "houston.backendSecret" . }}
  labels:
    release: {{ .Release.Name }}
    chart: {{ .Chart.Name }}
    heritage: {{ .Release.Service }}
    component: {{ template "houston.backendSecret" . }}
    plane: {{ .Values.global.plane.mode }}
  {{- if .Values.global.argoCD.annotation.enabled }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  {{- end }}
type: Opaque
data:
  # Deliberately a normal release-manifest resource, NOT a `pre-install` hook. The
  # real connection string is written here at runtime by the houston-bootstrapper
  # init container, and the helper preserves that live value on every re-render, so
  # `helm upgrade` never patches it back to the placeholder. A hook would drop this
  # out of the release manifest, and Helm would then DELETE it when upgrading from
  # any release that had it -- wedging every consumer on a missing volume. See
  # `astronomer.bootstrapSecretConnection` for the full reasoning.
  #
  # The placeholder is a deterministic sentinel rather than a random value: random
  # re-poisoned the live Secret on every render and churned consumers' checksum
  # annotations, and consumers can recognise the sentinel to tell "not bootstrapped
  # yet" from a real connection string.
  connection: {{ include "astronomer.bootstrapSecretConnection" (dict "ctx" $ "name" (include "houston.backendSecret" .)) }}
{{- end }}
{{- end }}
