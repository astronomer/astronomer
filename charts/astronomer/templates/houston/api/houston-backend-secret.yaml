###############################
## Houston Bootstrap Secrets ##
###############################
{{- if or (eq .Values.global.plane.mode "control") (eq .Values.global.plane.mode "unified") }}
{{- if and (not .Values.houston.backendSecretName) (not .Values.houston.backendConnection) }}
kind: Secret
apiVersion: v1
metadata:
  name: {{ template "houston.backendSecret" . }}
  labels:
    release: {{ .Release.Name }}
    chart: {{ .Chart.Name }}
    heritage: {{ .Release.Service }}
    component: {{ template "houston.backendSecret" . }}
    plane: {{ .Values.global.plane.mode }}
  annotations:
    # pre-install ONLY, mirroring houston-jwt-certificate-secret.yaml. The real
    # connection string is written into this Secret at runtime by the
    # houston-bootstrapper init container, so `helm upgrade` must never patch it
    # back to the placeholder -- hook resources are not part of the release
    # manifest, so Helm leaves the live value alone.
    "helm.sh/hook": "pre-install"
    "helm.sh/hook-delete-policy": "before-hook-creation"
    "helm.sh/hook-weight": "-5"
    {{ if .Values.global.argoCD.annotation.enabled }}
    argocd.argoproj.io/sync-wave: "-1"
    {{- end }}
type: Opaque
data:
  # A deterministic sentinel, not a random value. Two reasons: a random value
  # changes on every render, which used to re-poison the live Secret and churn
  # the pod's checksum annotation; and consumers can recognise the sentinel to
  # tell "not bootstrapped yet" from a real connection string.
  connection: {{ include "astronomer.secretSentinel" . | b64enc | quote }}
{{- end }}
{{- end }}
