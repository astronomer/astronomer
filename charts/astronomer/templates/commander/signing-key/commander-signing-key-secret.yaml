#####################################################
## Commander Signing-Key Secret                     ##
#####################################################
# Commander's own RSA keypair for issuing JWTs to dataplane services (its first
# consumer is the laminar hypervisor — Laminar Auth Integration ADR, Option 4).
# The private key mounts into commander (signs); the public cert mounts into
# consumers that validate the token (e.g. the hypervisor via LAMINAR_JWKS).
#
# These are plain release resources, NOT helm hooks: commander mounts the
# private key, so the secret must exist as part of the release on both install
# and upgrade (a pre-install hook never fires on an upgrade-only release, which
# leaves the commander pod stuck on FailedMount). To keep the keypair stable
# across upgrades, the existing secret is looked up and its material reused;
# a new keypair is generated only on first install or when
# regenerateKeyEachUpgrade is set.
{{- if or (eq .Values.global.plane.mode "data") (eq .Values.global.plane.mode "unified") }}
{{- $keySecretName := printf "%s-commander-signing-key" .Release.Name }}
{{- $certSecretName := printf "%s-commander-signing-cert" .Release.Name }}
{{- $existingKey := lookup "v1" "Secret" .Release.Namespace $keySecretName }}
{{- $existingCert := lookup "v1" "Secret" .Release.Namespace $certSecretName }}
{{- $tlsKey := "" }}
{{- $tlsCert := "" }}
{{- if and $existingKey $existingCert (not .Values.commander.signingKey.regenerateKeyEachUpgrade) }}
{{- $tlsKey = index $existingKey.data "tls.key" }}
{{- $tlsCert = index $existingCert.data "tls.crt" }}
{{- else }}
{{- $ca := genCA "ca" 3650 }}
{{- $cn := printf "%s-commander" .Release.Name }}
{{- $cert := genSignedCert $cn nil (list $cn) 3650 $ca }}
{{- $tlsKey = b64enc $cert.Key }}
{{- $tlsCert = b64enc $cert.Cert }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $keySecretName }}
  labels:
    component: commander
    tier: astronomer
    release: {{ .Release.Name }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    heritage: {{ .Release.Service }}
    plane: {{ .Values.global.plane.mode }}
type: Opaque
data:
  tls.key: {{ $tlsKey }}
---
##########################################################
## Commander Signing-Cert Secret  ########################
##########################################################
apiVersion: v1
kind: Secret
metadata:
  name: {{ $certSecretName }}
  labels:
    component: commander
    tier: astronomer
    release: {{ .Release.Name }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    heritage: {{ .Release.Service }}
    plane: {{ .Values.global.plane.mode }}
type: Opaque
data:
  tls.crt: {{ $tlsCert }}
{{- end }}
