######################################
## Commander FlightDeck Backend Secret
######################################
{{- if eq (include "flightdeck.backendSecretRendered" .) "true" }}
{{- /*
  Placeholder so the Secret exists before any pod mounts it. Previously nothing
  created it: the only writer was the flightdeck-bootstrapper init container
  INSIDE the commander pod, so mounting it as a volume deadlocked the pod --
  kubelet blocks on the missing Secret before running any container, including
  the bootstrapper that would have created it.

  Rendered only while commander or pilot reads the FlightDeck DSN from a file
  (flightdeck.backendSecretRendered). Through secretKeyRef nothing needs it in
  advance, so with those switches off the bootstrapper creates it at runtime as
  it always has, and an upgrade renders exactly as before -- no Helm ownership
  conflict with a Secret an older release's bootstrapper created. Turning file
  mode on is the one step that needs bin/adopt-bootstrap-secrets-pre-upgrade.py.

  A normal release-manifest resource, NOT a `pre-install` hook. Hooks do not run on
  `helm upgrade`, so enabling FlightDeck on an existing release would have created
  commander's projected volume source with nothing to create the Secret -- exactly
  the deadlock above, reached by upgrade instead of install. The helper preserves
  whatever the bootstrapper already wrote, so staying in the manifest costs nothing.

  `helm.sh/resource-policy: keep`, as cp-identity has: the Secret holds the only
  copy of the FlightDeck database credentials the bootstrapper generated, and
  without the policy Helm would delete it whenever it drops out of the manifest --
  file mode turned back off, FlightDeck turned off, or a rollback to a release
  without this template. Kept, it survives all three, as the unmanaged Secret did
  before. It also keeps its Helm ownership label and annotations, so turning file
  mode on again later re-adopts it with no adoption step, and the helper renders
  the bootstrapped value back rather than the sentinel. Helm reads the policy off
  the live object, so it is set from the first release that manages the Secret.

  ArgoCD ignores `helm.sh/resource-policy`: it would prune the Secret when it drops
  out of the rendered manifest. So with the chart's ArgoCD annotations on, it also
  gets `argocd.argoproj.io/sync-options: Prune=false`, for the same reason.
*/}}
kind: Secret
apiVersion: v1
metadata:
  name: {{ .Release.Name }}-flightdeck-backend
  labels:
    component: commander
    tier: astronomer
    release: {{ .Release.Name }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    heritage: {{ .Release.Service }}
    plane: {{ .Values.global.plane.mode }}
  annotations:
    "helm.sh/resource-policy": keep
    {{- if .Values.global.argoCD.annotation.enabled }}
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false
    {{- end }}
type: Opaque
data:
  connection: {{ include "astronomer.bootstrapSecretConnection" (dict "ctx" $ "name" (printf "%s-flightdeck-backend" .Release.Name)) }}
{{- end }}
