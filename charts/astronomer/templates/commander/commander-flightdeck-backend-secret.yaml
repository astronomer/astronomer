######################################
## Commander FlightDeck Backend Secret
######################################
{{- if or (eq .Values.global.plane.mode "data") (eq .Values.global.plane.mode "unified") }}
{{- if or .Values.flightDeck.enabled (and .Values.global.dataPlaneFailover.enabled (eq .Values.global.plane.mode "data")) }}
{{- /*
  Placeholder so the Secret exists before any pod mounts it. Previously nothing
  created it: the only writer was the flightdeck-bootstrapper init container
  INSIDE the commander pod, so mounting it as a volume deadlocked the pod --
  kubelet blocks on the missing Secret before running any container, including
  the bootstrapper that would have created it.

  A normal release-manifest resource, NOT a `pre-install` hook. Hooks do not run on
  `helm upgrade`, so enabling FlightDeck on an existing release would have created
  commander's projected volume source with nothing to create the Secret -- exactly
  the deadlock above, reached by upgrade instead of install. The helper preserves
  whatever the bootstrapper already wrote, so staying in the manifest costs nothing.
*/}}
kind: Secret
apiVersion: v1
metadata:
  name: {{ .Release.Name }}-flightdeck-backend
  labels:
    component: commander
    tier: astronomer
    release: {{ .Release.Name }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    heritage: {{ .Release.Service }}
    plane: {{ .Values.global.plane.mode }}
  {{- if .Values.global.argoCD.annotation.enabled }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  {{- end }}
type: Opaque
data:
  connection: {{ include "astronomer.bootstrapSecretConnection" (dict "ctx" $ "name" (printf "%s-flightdeck-backend" .Release.Name)) }}
{{- end }}
{{- end }}
