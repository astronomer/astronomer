###########################
## MCP Server Service    ##
###########################
{{- if eq (include "mcpServer.enabled" .) "true" }}
kind: Service
apiVersion: v1
metadata:
  name: {{ template "mcpServer.fullname" . }}
  labels:
    component: {{ template "mcpServer.name" . }}
    tier: astronomer
    release: {{ .Release.Name }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    heritage: {{ .Release.Service }}
    plane: {{ .Values.global.plane.mode }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: {{ .Values.ports.mcpServerHTTP | quote }}
spec:
  type: ClusterIP
  selector:
    component: {{ template "mcpServer.name" . }}
    tier: astronomer
    release: {{ .Release.Name }}
  ports:
    - name: mcp-server-http
      protocol: TCP
      port: {{ .Values.ports.mcpServerHTTP }}
      targetPort: {{ .Values.ports.mcpServerHTTP }}
      appProtocol: http
{{- end }}
