###########################
## Astronomer UI Service ##
###########################
{{- if eq (include "astronomer.controlPlaneEnabled" .) "true" }}
kind: Service
apiVersion: v1
metadata:
  name: {{ .Release.Name }}-astro-ui
  labels:
    component: astro-ui
    tier: astronomer
    release: {{ .Release.Name }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    heritage: {{ .Release.Service }}
    plane: {{ .Values.global.plane.mode }}
spec:
  type: ClusterIP
  selector:
    component: astro-ui
    tier: astronomer
    release: {{ .Release.Name }}
  ports:
    - name: astro-ui-http
      protocol: TCP
      port: {{ .Values.ports.astroUIHTTP }}
      targetPort: {{ .Values.ports.astroUIHTTP }}
      appProtocol: http
{{- end }}
