###############################
## Prometheus VirtualService ##
###############################
{{- if eq (include "global.ingress.enabled" .) "true" }}
{{- if ((.Values.global.istio | default dict).gateway | default dict).enabled }}
{{- if and .Values.global.baseDomain (or (ne .Values.global.plane.mode "data") .Values.global.plane.domainPrefix) }}
{{- $emitGlobalHost := and .Values.global.controlPlaneHA.enabled (eq (include "astronomer.controlPlaneEnabled" .) "true") }}
kind: VirtualService
apiVersion: {{ template "apiVersion.istio.networking" . }}
metadata:
  name: {{ template "prometheus.fullname" . }}-virtualservice
  labels:
    tier: prometheus-networking
    component: prometheus-virtualservice
    chart: {{ template "prometheus.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  gateways:
    - {{ required "global.istio.gateway.name is required when global.istio.gateway.enabled is true" .Values.global.istio.gateway.name }}
  hosts:
    - {{ template "prometheus.url" . }}
    {{- if $emitGlobalHost }}
    - {{ template "prometheus.globalUrl" . }}
    {{- end }}
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: {{ template "prometheus.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: {{ .Values.global.authSidecar.port }}
{{- end }}
{{- end }}
{{- end }}
