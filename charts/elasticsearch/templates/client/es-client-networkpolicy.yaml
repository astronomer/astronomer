#####################################
## Elasticsearch Client NetworkPolicy
#####################################
{{- if .Values.global.networkPolicy.enabled }}
{{- if eq (include "logging.enabled" .) "true" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ template "elasticsearch.fullname" . }}-client-policy
  labels:
    tier: logging
    component: {{ template "elasticsearch.name" . }}
    chart: {{ template "elasticsearch.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    role: client
    plane: {{ .Values.global.plane.mode }}
spec:
  podSelector:
    matchLabels:
      tier: logging
      component: {{ template "elasticsearch.name" . }}
      release: {{ .Release.Name }}
      role: client
  policyTypes:
  - Ingress
  ingress:
  - from:
    # Ingress controllers are intentionally not admitted here: external traffic must
    # go through the nginx auth proxy (es-ingress-controller), never directly to ES.
    {{- if (eq .Values.global.plane.mode "unified") }}
    - podSelector:
        matchLabels:
          tier: astronomer
          component: houston
          release: {{ .Release.Name }}
    - podSelector:
        matchLabels:
          tier: astronomer
          component: houston-worker
          release: {{ .Release.Name }}
    {{- end }}
    - podSelector:
        matchLabels:
          tier: logging
          component: vector
          release: {{ .Release.Name }}
    - podSelector:
        matchLabels:
          tier: logging
          component: {{ template "elasticsearch.name" . }}
          release: {{ .Release.Name }}
    - podSelector:
        matchLabels:
          tier: logging
          component: {{ template "elasticsearch.name" . }}-exporter
          release: {{ .Release.Name }}
    - podSelector:
        matchLabels:
          tier: elasticsearch
          component: es-ingress-controller
          release: {{ .Release.Name }}
    ports:
    - protocol: TCP
      port: {{ .Values.common.ports.http }}
    - protocol: TCP
      port: {{ .Values.common.ports.transport }}
{{- end }}
{{- end }}
