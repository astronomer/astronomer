#######################
## Curator ConfigMap ##
#######################
{{- if .Values.curator.enabled }}
{{- if eq (include "logging.enabled" .) "true" }}
{{- include "curator.age.validate" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "elasticsearch.fullname" . }}-curator-config
  labels:
    tier: logging
    component: {{ template "elasticsearch.name" . }}
    chart: {{ template "elasticsearch.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
    plane: {{ .Values.global.plane.mode }}
data:
  action_file.yml: |-
    ---
    # Remember, leave a key empty if there is no value.  None will be a string,
    # not a Python "NoneType"
    #
    # Also remember that all examples have 'disable_action' set to True.  If you
    # want to use this action as a template, be sure to set this to False after
    # copying it.
    actions:
      1:
        action: delete_indices
        description: "Clean up ES by deleting old indices"
        options:
          timeout_override:
          continue_if_exception: False
          ignore_empty_list: True
          disable_action: False
        filters:
        # `unit` must not be finer than the finest component of `timestring`, or curator
        # deletes the index it is still writing to. See PINF-578 and the granularity rule
        # documented on curator.age in the elasticsearch chart values.yaml.
        {{- if .Values.curator.age.unit }}
        # unit set explicitly via curator.age.unit
        {{- else }}
        # unit derived from timestring granularity (curator.age.unit is unset)
        {{- end }}
        - filtertype: age
          source: name
          direction: older
          timestring: {{ template "curator.indexPattern" . }}
          unit: {{ include "curator.age.unit" . }}
          unit_count: {{ .Values.curator.age.unit_count }}
          field:
          stats_result:
          epoch:
          exclude: False
  config.yml: |-
    ---
    # Remember, leave a key empty if there is no value.  None will be a string,
    # not a Python "NoneType"
    elasticsearch:
      client:
        hosts:
          - {{ .Values.common.protocol }}://{{ template "elasticsearch.fullname" . }}:{{ .Values.common.ports.http }}
        ca_certs:
        client_cert:
        client_key:
        verify_certs:
        request_timeout: 30
      other_settings:
        master_only: False
    logging:
      loglevel: INFO
      logfile:
      logformat: default
      blacklist: ['elasticsearch', 'urllib3']
  {{- end }}
{{- end }}
