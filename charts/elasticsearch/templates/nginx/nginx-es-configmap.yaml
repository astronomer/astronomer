###################################
## NGINX Elasticsearch ConfigMap ##
###################################
{{- if eq (include "logging.enabled" .) "true" }}
{{- $authCacheEnabled := .Values.nginx.authCache.enabled }}
kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ .Release.Name }}-nginx-es
  labels:
    component: nginx
    tier: {{ template "nginx-es.name" . }}
    release: {{ .Release.Name }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    heritage: {{ .Release.Service }}
data:
  nginx.conf: |-
    worker_processes 1;
    pid /tmp/nginx.pid;
    events { worker_connections 1024; }
    error_log /dev/stdout info;

    http {
      {{- if $authCacheEnabled }}
      log_format cache_status '$remote_addr - $remote_user [$time_local] '
                              '"$request" $status $body_bytes_sent '
                              '"$http_referer" "$http_user_agent" '
                              'cache=$auth_cache_status';
      access_log /dev/stdout cache_status;
      {{- else }}
      access_log /dev/stdout;
      {{- end }}

      client_max_body_size {{ .Values.nginx.maxBodySize }};
      {{- if $authCacheEnabled }}

      proxy_cache_path /tmp/nginx-auth-cache levels={{ .Values.nginx.authCache.levels }} keys_zone={{ .Values.nginx.authCache.keysZone }} max_size={{ .Values.nginx.authCache.maxSize }} inactive={{ .Values.nginx.authCache.inactive }};

      # A request with neither an Authorization header nor a cookie has no credential to key a cached answer on, so
      # its answer must not be stored or served from the cache (see proxy_cache_bypass in /auth below).
      map "$http_authorization$http_cookie" $es_auth_uncacheable {
        default 0;
        "" 1;
      }
      {{- end }}

      upstream elasticsearch {
        server {{ .Release.Name }}-elasticsearch.{{ .Release.Namespace }}:{{ .Values.common.ports.http }};
        keepalive 15;
      }

      server {
        listen {{ .Values.common.ports.http }};
        auth_request /auth;
        {{- if $authCacheEnabled }}
        auth_request_set $auth_cache_status $upstream_cache_status;
        {{- end }}
        proxy_http_version 1.1;
        {{- if not .Values.global.istio.enabled }}
        proxy_set_header Host $host;
        {{- end }}
        proxy_set_header Connection "Keep-Alive";
        proxy_set_header Proxy-Connection "Keep-Alive";

        # The index is built from the authorized scope ($es_scope), never from the request URL. It is used in proxy_pass, not a rewrite.
        auth_request_set $es_scope $upstream_http_x_elasticsearch_index_scope;

        # The following "location" rules limit callers to only their indices. Any further
        # additions should follow this pattern.
        location ~* /_count$ {
          proxy_pass http://elasticsearch/{{ include "logging.indexNamePrefix" . }}.$es_scope.*/_count$is_args$args;
        }

        location ~* /_bulk$ {
          proxy_pass http://elasticsearch/{{ include "logging.indexNamePrefix" . }}.$es_scope.*/_bulk$is_args$args;
        }

        location ~* /_search$ {
          proxy_pass http://elasticsearch/{{ include "logging.indexNamePrefix" . }}.$es_scope.*/_search$is_args$args;
        }

        location = /auth {
          internal;
          {{- if $authCacheEnabled }}
          proxy_cache auth_cache;
          # Keyed on credential, cookie, host and URI, since the authorization answer can differ by each.
          proxy_cache_key "$http_authorization|$http_cookie|$host|$request_uri";
          proxy_cache_bypass $es_auth_uncacheable;
          proxy_no_cache $es_auth_uncacheable;
          proxy_cache_valid 200 {{ .Values.nginx.authCache.validSuccess }};
          proxy_cache_valid 401 403 {{ .Values.nginx.authCache.validFailure }};
          proxy_ignore_headers Cache-Control Expires;
          add_header X-Auth-Cache-Status $upstream_cache_status always;
          {{- end }}
          {{- include "houston-es-authorization-proxy" . | nindent 10 }}
          proxy_pass_request_body off;
          proxy_set_header Content-Length "";
          # The original URL, host included. The control plane's ingress overwrites X-Original-URI.
          proxy_set_header X-ES-Original-URI $scheme://$host$request_uri;
        }

        location = /_cluster/state/version {
          proxy_pass http://elasticsearch;
        }

        location = /_cluster/health {
          proxy_pass http://elasticsearch;
        }

        location ~ ^/ {
          deny all;
        }
      }
    }
{{- end }}
