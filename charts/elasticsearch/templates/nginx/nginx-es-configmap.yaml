###################################
## NGINX Elasticsearch ConfigMap ##
###################################
{{- if eq (include "logging.enabled" .) "true" }}
{{- $authCacheEnabled := .Values.nginx.authCache.enabled }}
kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ .Release.Name }}-nginx-es
  labels:
    component: nginx
    tier: {{ template "nginx-es.name" . }}
    release: {{ .Release.Name }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    heritage: {{ .Release.Service }}
data:
  nginx.conf: |-
    worker_processes 1;
    pid /tmp/nginx.pid;
    events { worker_connections 1024; }
    error_log /dev/stdout info;

    http {
      {{- if $authCacheEnabled }}
      log_format cache_status '$remote_addr - $remote_user [$time_local] '
                              '"$request" $status $body_bytes_sent '
                              '"$http_referer" "$http_user_agent" '
                              'cache=$auth_cache_status';
      access_log /dev/stdout cache_status;
      {{- else }}
      access_log /dev/stdout;
      {{- end }}

      client_max_body_size {{ .Values.nginx.maxBodySize }};
      {{- if $authCacheEnabled }}

      proxy_cache_path /tmp/nginx-auth-cache levels={{ .Values.nginx.authCache.levels }} keys_zone={{ .Values.nginx.authCache.keysZone }} max_size={{ .Values.nginx.authCache.maxSize }} inactive={{ .Values.nginx.authCache.inactive }};
      {{- end }}

      upstream elasticsearch {
        server {{ .Release.Name }}-elasticsearch.{{ .Release.Namespace }}:{{ .Values.common.ports.http }};
        keepalive 15;
      }

      server {
        listen {{ .Values.common.ports.http }};
        auth_request /auth;
        # Houston answers "*" here only for its own astronomer-bot credential (it reads
        # component logs for every deployment). Deployments never get it, so they stay
        # confined to their own indices by the rewrites below.
        auth_request_set $es_index_scope $upstream_http_x_elasticsearch_index_user;
        {{- if $authCacheEnabled }}
        auth_request_set $auth_cache_status $upstream_cache_status;
        {{- end }}
        proxy_http_version 1.1;
        {{- if not .Values.global.istio.enabled }}
        proxy_set_header Host $host;
        {{- end }}
        proxy_set_header Connection "Keep-Alive";
        proxy_set_header Proxy-Connection "Keep-Alive";

        # The following "location" rules limit airflow interactions to only their indices. Any further
        # additions should follow this pattern.
        location ~* /_count$ {
          rewrite /_count(.*) /{{ include "logging.indexNamePrefix" . }}.$remote_user.*/_count$1 break;
          proxy_pass http://elasticsearch;
        }

        location ~* /_bulk$ {
          rewrite /_bulk(.*) /{{ include "logging.indexNamePrefix" . }}.$remote_user.*/_bulk$1 break;
          proxy_pass http://elasticsearch;
        }

        # Houston's astronomer-bot searches the indices it asked for, read-only.
        # _count and _bulk keep the per-deployment rewrite for every caller.
        location ~* /_search$ {
          if ($es_index_scope = "*") {
            break;
          }
          rewrite /_search(.*) /{{ include "logging.indexNamePrefix" . }}.$remote_user.*/_search$1 break;
          proxy_pass http://elasticsearch;
        }

        location = /auth {
          internal;
          {{- if $authCacheEnabled }}
          proxy_cache auth_cache;
          proxy_cache_key "$http_authorization";
          proxy_cache_valid 200 {{ .Values.nginx.authCache.validSuccess }};
          proxy_cache_valid 401 403 {{ .Values.nginx.authCache.validFailure }};
          proxy_ignore_headers Cache-Control Expires;
          add_header X-Auth-Cache-Status $upstream_cache_status always;
          {{- end }}
          {{- include "houston-proxy" . | nindent 10 }}
          proxy_pass_request_body off;
          proxy_set_header Content-Length "";
          proxy_set_header X-Original-URI $request_uri;
        }

        location = /_cluster/state/version {
          proxy_pass http://elasticsearch;
        }

        location = /_cluster/health {
          proxy_pass http://elasticsearch;
        }

        location ~ ^/ {
          deny all;
        }
      }
    }
{{- end }}
