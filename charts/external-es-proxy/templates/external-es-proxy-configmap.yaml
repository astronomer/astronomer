###################################
## Elasticsearch Proxy ConfigMap ##
###################################
{{- if eq (include "logging.enabled" .) "true" }}
{{- $secretsFromFiles := eq "true" (include "secretsFromFiles.enabled" (dict "ctx" $ "component" .Values.global.customLogging "key" "global.customLogging")) }}
{{- /* Same condition as the es-secret volume in external-es-proxy-deployment.yaml. */}}
{{- $esSecretFromFile := and $secretsFromFiles .Values.global.customLogging.secretName }}
{{- $authCacheEnabled := .Values.authCache.enabled }}
kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ template "external-es-proxy.fullname" . }}
  labels:
    tier: external-logging
    component: {{ template "external-es-proxy.name" . }}
    chart: {{ template "external-es-proxy.chart" . }}
    heritage: {{ .Release.Service }}
    release: {{ .Release.Name }}
    plane: {{ .Values.global.plane.mode }}
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    events { worker_connections 1024; }
    error_log /dev/stdout info;
{{- if not $secretsFromFiles }}
    env ES_SECRET;
    env ES_SECRET_NAME;
{{- end }}

    http {
{{- if $esSecretFromFile }}
      # Read the Elasticsearch credential from its mounted file once, at startup.
      # setenv.lua runs per request, so it must not do file I/O itself.
      #
      # Erroring here is deliberate, as in prometheus's federation-auth: nginx
      # refuses to start rather than coming up and proxying every request without
      # its credential. That is the strict rule the secrets loaders follow -- with
      # secrets-from-files on, a secret the component was given must be readable
      # and non-empty, or the process does not start.
      init_by_lua_block {
        local path = "/etc/astronomer/secrets/ES_SECRET"
        local handle, open_err = io.open(path, "r")
        if not handle then
          -- io.open's message already starts with the path; name it only once.
          local reason = tostring(open_err)
          if not reason:find(path, 1, true) then
            reason = path .. ": " .. reason
          end
          error("external-es-proxy: cannot open credential file " .. reason)
        end
        local contents = handle:read("*a")
        handle:close()
        if not contents then
          error("external-es-proxy: credential file is unreadable: " .. path)
        end
        -- Strip the trailing newline a Secret mount may carry.
        local credential = contents:gsub("%s+$", "")
        if credential == "" then
          error("external-es-proxy: credential file is empty: " .. path)
        end
        ES_SECRET_FROM_FILE = credential
      }
{{- end }}
      {{- if $authCacheEnabled }}
      log_format cache_status '$remote_addr - $remote_user [$time_local] '
                              '"$request" $status $body_bytes_sent '
                              '"$http_referer" "$http_user_agent" '
                              'cache=$auth_cache_status';
      access_log /dev/stdout cache_status;
      {{- else }}
      access_log /dev/stdout;
      {{- end }}
      client_max_body_size 1024M;
      {{- if $authCacheEnabled }}
      proxy_cache_path /tmp/nginx-auth-cache levels={{ .Values.authCache.levels }} keys_zone={{ .Values.authCache.keysZone }} max_size={{ .Values.authCache.maxSize }} inactive={{ .Values.authCache.inactive }};
      {{- end }}

      server {
        listen {{ .Values.service.securehttp }};
        auth_request /auth;
        {{- if $authCacheEnabled }}
        auth_request_set $auth_cache_status $upstream_cache_status;
        {{- end }}
        proxy_http_version 1.1;
        proxy_set_header Connection "Keep-Alive";
        proxy_set_header Proxy-Connection "Keep-Alive";

        # The following "location" rules limit airflow interactions to only their indices. Any further
        # additions should follow this pattern.
        location ~* /_count$ {
          rewrite /_count(.*) /{{ include "logging.indexNamePrefix" . }}.$remote_user.*/_count$1 break;
          {{- include "external-es-proxy-nginx-location-common" . | indent 10 }}
        }

        location ~* /_bulk$ {
          rewrite /_bulk(.*) /{{ include "logging.indexNamePrefix" . }}.$remote_user.*/_bulk$1 break;
          {{- include "external-es-proxy-nginx-location-common" . | indent 10 }}
        }

        location ~* /_search$ {
          # This combined with disabling explicit index searching downstream
          # prevents any deployment from being able to query any other indexes.
          rewrite /_search(.*) /{{ include "logging.indexNamePrefix" . }}.$remote_user.*/_search$1 break;
          {{- include "external-es-proxy-nginx-location-common" . | indent 10 }}
        }

        location = /auth {
          internal;
          {{- if $authCacheEnabled }}
          proxy_cache auth_cache;
          proxy_cache_key "$http_authorization";
          proxy_cache_valid 200 {{ .Values.authCache.validSuccess }};
          proxy_cache_valid 401 403 {{ .Values.authCache.validFailure }};
          proxy_ignore_headers Cache-Control Expires;
          add_header X-Auth-Cache-Status $upstream_cache_status always;
          {{- end }}
          {{- include "houston-proxy" . | nindent 10 }}
          proxy_pass_request_body off;
          proxy_set_header Content-Length "";
          proxy_set_header X-Original-URI $request_uri;
        }

        location = /_cluster/state/version {
          {{- include "external-es-proxy-nginx-location-common" . | indent 10 }}
        }

        location = /_cluster/health {
          {{- include "external-es-proxy-nginx-location-common" . | indent 10 }}
        }

      }
      server {
        listen {{ .Values.service.http }};
        proxy_http_version 1.1;
        proxy_set_header Connection "Keep-Alive";
        proxy_set_header Proxy-Connection "Keep-Alive";

        location ~ ^/ {
          {{- include "external-es-proxy-nginx-location-common" . | indent 10 }}
        }
      }
    }
{{- end }}
