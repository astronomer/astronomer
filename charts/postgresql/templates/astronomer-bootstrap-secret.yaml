#################################
## Astronomer Bootstrap Secret
#################################
{{- if .Values.global.postgresqlEnabled }}
apiVersion: v1
kind: Secret
metadata:
  name: astronomer-bootstrap
  {{ if .Values.global.enableArgoCDAnnotation }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  {{- end }}
data:
  {{- if .Values.global.pgbouncer.enabled }}
  connection: {{ printf "postgres://%s:%s@%s-pgbouncer.%s.svc.%s:%s" .Values.global.pgbouncer.username .Values.global.pgbouncer.password .Release.Name .Release.Namespace .Values.global.clusterDomain ( .Values.global.pgbouncer.servicePort | toString ) | b64enc | quote }}
  {{- else }}
  connection: {{ printf "postgres://%s:%s@%s-postgresql.%s.svc.%s:%s" .Values.postgresqlUsername .Values.postgresqlPassword .Release.Name .Release.Namespace .Values.global.clusterDomain ( or .Values.global.postgresql.servicePort .Values.service.port | toString ) | b64enc | quote }}
  {{- end }}
{{- end }}
