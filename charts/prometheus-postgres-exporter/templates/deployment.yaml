{{- if .Values.global.prometheusPostgresExporter.enabled -}}
{{- if and .Values.config.datasource.passwordSecret .Values.config.datasource.password -}}
{{ fail (printf "ERROR: only one of .Values.config.datasource.passwordSecret and .Values.config.datasource.password must be defined") }}
{{- end -}}
{{- if and .Values.config.datasource.connectionSecret (or .Values.config.datasource.passwordSecret .Values.config.datasource.password) -}}
{{ fail (printf "ERROR: when .Values.config.datasource.connectionSecret is specified, .Values.config.datasource.passwordSecret and .Values.config.datasource.password must not be defined") }}
{{- end -}}
{{- /* Load the credentials from files rather than the environment.

       postgres_exporter reads DATA_SOURCE_URI_FILE, _USER_FILE and _PASS_FILE, but has
       no DATA_SOURCE_NAME_FILE, so with the toggle on:
         - in the default connectionSecret form, an init container
           (files/split-data-source-name.sh) splits the connection string into those
           three files, in a memory-backed emptyDir. The Secret holding the whole DSN is
           mounted only in that init container;
         - in the split form, the password Secret is mounted and read through
           DATA_SOURCE_PASS_FILE. With neither passwordSecret nor password set, the only
           form left is a secretKeyRef on a Secret the chart never creates, so the
           render fails rather than leaving a secret in the exporter's environment. */}}
{{- $secretsFromFiles := eq "true" (include "secretsFromFiles.enabled" (dict "ctx" $ "component" .Values "key" "prometheus-postgres-exporter")) }}
{{- if and $secretsFromFiles (not .Values.config.datasource.connectionSecret) (not (or .Values.config.datasource.passwordSecret .Values.config.datasource.password)) }}
{{- fail "secret-file-missing: prometheus-postgres-exporter.config.datasource sets neither passwordSecret nor password, so secrets-from-files has no password file to give the exporter, and the only alternative is a secretKeyRef on a Secret the chart never creates. Set config.datasource.passwordSecret to the Secret and key holding the password (or set password), or set prometheus-postgres-exporter.secretsFromFiles.enabled=false to keep the exporter on environment variables." }}
{{- end }}
{{- $dsnFromFile := and $secretsFromFiles .Values.config.datasource.connectionSecret }}
{{- $passwordFromFile := and $secretsFromFiles (not .Values.config.datasource.connectionSecret) (or .Values.config.datasource.passwordSecret .Values.config.datasource.password) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "prometheus-postgres-exporter.fullname" . }}
  labels:
    app: {{ template "prometheus-postgres-exporter.name" . }}
    component: {{ template "prometheus-postgres-exporter.name" . }}
    chart: {{ template "prometheus-postgres-exporter.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ template "prometheus-postgres-exporter.name" . }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        tier: monitoring
        version: {{ .Chart.Version }}
        release: {{ .Release.Name }}
        component: {{ template "prometheus-postgres-exporter.name" . }}
        app: {{ template "prometheus-postgres-exporter.name" . }}
        {{- include "global.podLabels" . | nindent 8 }}
{{- if .Values.podLabels }}
{{ toYaml .Values.podLabels | trim | indent 8 }}
{{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
{{- if .Values.global.podAnnotations }}
{{ toYaml .Values.global.podAnnotations | indent 8 }}
{{- end }}
{{- if .Values.podannotations }}
{{ toYaml .Values.podannotations | indent 8 }}
{{- end }}
    spec:
      nodeSelector: {{ toYaml (default .Values.global.platformNodePool.nodeSelector .Values.nodeSelector) | nindent 8 }}
      affinity: {{ toYaml (default .Values.global.platformNodePool.affinity .Values.affinity) | nindent 8 }}
      tolerations: {{ toYaml (default .Values.global.platformNodePool.tolerations .Values.tolerations) | nindent 8 }}
      serviceAccountName: {{ template "prometheus-postgres-exporter.serviceAccountName" . }}
      securityContext: {{- include "platform.podSecurityContext" (list $ nil) | nindent 8 }}
{{- include "prometheus-postgres-exporter.imagePullSecrets" . | indent 6 }}
      {{- if $dsnFromFile }}
      initContainers:
        - name: split-data-source-name
          image: {{ include "prometheus-postgres-exporter.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- include "platform.containerSecurityContext" (list $ nil) | nindent 12 }}
          command:
            - /bin/sh
            - -c
            - |
              {{- .Files.Get "files/split-data-source-name.sh" | trim | nindent 14 }}
            - split-data-source-name
            - /etc/astronomer/data-source-name/data_source_name
            - /etc/astronomer/secrets
          resources: {{ toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data-source-name
              mountPath: /etc/astronomer/data-source-name
              readOnly: true
            - name: data-source-files
              mountPath: /etc/astronomer/secrets
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext: {{- include "platform.containerSecurityContext" (list $ nil) | nindent 12 }}
          args:
          - "--extend.query-path=/etc/config.yaml"
          {{- if .Values.config.disableDefaultMetrics }}
          - "--disable-default-metrics"
          {{- end }}
          {{- if .Values.config.disableSettingsMetrics }}
          - "--no-collector.settings"
          {{- end }}
          {{- if .Values.config.autoDiscoverDatabases }}
          - "--auto-discover-databases"
          {{- if .Values.config.excludeDatabases }}
          - "--exclude-databases"
          - {{ .Values.config.excludeDatabases | join "," }}
          {{- end }}
          {{- end }}
          env:
          {{- if eq .Values.config.datasource.sslmode "disable" }}
          - name: SSL_MODE_OFF
            value: "1"
          {{- end }}
          {{- if $dsnFromFile }}
          - name: DATA_SOURCE_URI_FILE
            value: /etc/astronomer/secrets/data_source_uri
          - name: DATA_SOURCE_USER_FILE
            value: /etc/astronomer/secrets/data_source_user
          - name: DATA_SOURCE_PASS_FILE
            value: /etc/astronomer/secrets/data_source_password
          {{- else if .Values.config.datasource.connectionSecret }}
          - name: DATA_SOURCE_NAME
            valueFrom:
              secretKeyRef:
                name: {{ .Values.config.datasource.connectionSecret.name }}
                key: {{ .Values.config.datasource.connectionSecret.key }}
          {{- else }}
          - name: DATA_SOURCE_URI
            value: {{ template "prometheus-postgres-exporter.data_source_uri" . }}
          - name: DATA_SOURCE_USER
            value: {{ .Values.config.datasource.user }}
          {{- if $passwordFromFile }}
          - name: DATA_SOURCE_PASS_FILE
            value: /etc/astronomer/secrets/data_source_password
          {{- else }}
          - name: DATA_SOURCE_PASS
            valueFrom:
              secretKeyRef:
          {{- if .Values.config.datasource.passwordSecret }}
                name: {{ .Values.config.datasource.passwordSecret.name }}
                key: {{ .Values.config.datasource.passwordSecret.key }}
          {{- else }}
                name: {{ template "prometheus-postgres-exporter.fullname" . }}
                key: data_source_password
          {{- end }}
          {{- end }}
          {{- end }}
          image: {{ include "prometheus-postgres-exporter.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: {{ .Values.service.name }}
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          {{ if .Values.livenessProbe }}
          livenessProbe: {{ tpl (toYaml .Values.livenessProbe) . | nindent 12 }}
          {{ else }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- end }}
          {{ if .Values.readinessProbe }}
          readinessProbe: {{ tpl (toYaml .Values.readinessProbe) . | nindent 12 }}
          {{ else }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- end }}
          {{ if .Values.startupProbe }}
          startupProbe: {{ tpl (toYaml .Values.startupProbe) . | nindent 12 }}
          {{ else }}
          startupProbe:
            tcpSocket:
              port: {{ .Values.service.targetPort }}
            failureThreshold: 30
            periodSeconds: 10
          {{- end }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: queries
              mountPath: /etc/config.yaml
              subPath: config.yaml
            {{- if $passwordFromFile }}
            - name: data-source-pass
              mountPath: /etc/astronomer/secrets
              readOnly: true
            {{- end }}
            {{- if $dsnFromFile }}
            - name: data-source-files
              mountPath: /etc/astronomer/secrets
              readOnly: true
            {{- end }}
{{- with .Values.extraContainers }}
{{ tpl . $ | indent 8 }}
{{- end }}
      volumes:
      - configMap:
          defaultMode: 420
          name: {{ template "prometheus-postgres-exporter.fullname" . }}
        name: queries
      {{- if $passwordFromFile }}
      {{- /* No defaultMode, so the file keeps the 0644 default. The container runs
             runAsNonRoot with no runAsUser, and this pod sets no fsGroup, so 0440 on
             a root-owned file would leave the password unreadable. Same deferred
             decision as the external-es-proxy and federation-auth groups: tightening
             it means pinning the image UID and adding an fsGroup. */}}
      - name: data-source-pass
        secret:
          {{- if .Values.config.datasource.passwordSecret }}
          secretName: {{ .Values.config.datasource.passwordSecret.name }}
          items:
          - key: {{ .Values.config.datasource.passwordSecret.key }}
            path: data_source_password
          {{- else }}
          secretName: {{ template "prometheus-postgres-exporter.fullname" . }}
          items:
          - key: data_source_password
            path: data_source_password
          {{- end }}
      {{- end }}
      {{- if $dsnFromFile }}
      {{- /* Mounted only in the init container. No defaultMode, for the same reason as
             data-source-pass. */}}
      - name: data-source-name
        secret:
          secretName: {{ .Values.config.datasource.connectionSecret.name }}
          items:
          - key: {{ .Values.config.datasource.connectionSecret.key }}
            path: data_source_name
      {{- /* The split files, the password among them, kept off the node's disk. Both
             containers run as the same user, so the init container's 0600 files are
             readable by the exporter and no one else. */}}
      - name: data-source-files
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
      {{- end }}
{{- with .Values.extraVolumes }}
{{ tpl . $ | indent 6 }}
{{- end }}
{{- end }}
