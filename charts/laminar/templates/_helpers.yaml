{{/* vim: set filetype=mustache: */}}

{{/*
Whether the laminar (Laminar) components should be rendered.
Laminar runs on the data plane, so only in data / unified mode.
*/}}
{{- define "laminar.enabled" -}}
{{- eq (include "astronomer.dataPlaneEnabled" .) "true" -}}
{{- end -}}

{{/*
Fully qualified component name: <release>-laminar-<component>.
Call with (list $ "<component>"), e.g. (list $ "api-server").
*/}}
{{- define "laminar.fullname" -}}
{{- $ := index . 0 -}}
{{- $component := index . 1 -}}
{{- printf "%s-laminar-%s" $.Release.Name $component | trunc 63 | trimSuffix "-" -}}
{{- end -}}

{{/*
ServiceAccount name for a component. Call with (list $ "<component>").
*/}}
{{- define "laminar.serviceAccountName" -}}
{{- $ := index . 0 -}}
{{- $component := index . 1 -}}
{{- if and $.Values.serviceAccount.create $.Values.global.rbac.enabled -}}
{{- default (include "laminar.fullname" (list $ $component)) $.Values.serviceAccount.name -}}
{{- else -}}
default
{{- end -}}
{{- end -}}

{{/*
Laminar container image.
*/}}
{{- define "laminar.image" -}}
{{- if .Values.global.privateRegistry.enabled -}}
{{ .Values.global.privateRegistry.repository }}/ap-laminar:{{ .Values.images.laminar.tag }}
{{- else -}}
{{ .Values.images.laminar.repository }}:{{ .Values.images.laminar.tag }}
{{- end -}}
{{- end -}}

{{/*
Image pull secrets.
*/}}
{{- define "laminar.imagePullSecrets" -}}
{{- if and .Values.global.privateRegistry.enabled .Values.global.privateRegistry.secretName }}
imagePullSecrets:
  - name: {{ .Values.global.privateRegistry.secretName }}
{{- else if .Values.imagePullSecrets }}
imagePullSecrets:
{{- toYaml .Values.imagePullSecrets | nindent 2 }}
{{- end -}}
{{- end -}}

{{/*
Common metadata labels for a component. Call with (list $ "<component>").
*/}}
{{- define "laminar.labels" -}}
{{- $ := index . 0 -}}
{{- $component := index . 1 -}}
component: {{ $component }}
release: {{ $.Release.Name }}
chart: {{ $.Chart.Name }}-{{ $.Chart.Version }}
heritage: {{ $.Release.Service }}
tier: laminar
plane: {{ $.Values.global.plane.mode }}
{{- end -}}

{{/*
Pod selector / match labels for a component. Call with (list $ "<component>").
Kept identical to the original Kustomize manifests so Services/ServiceMonitors match.
*/}}
{{- define "laminar.selectorLabels" -}}
{{- $ := index . 0 -}}
{{- $component := index . 1 -}}
component: {{ $component }}
release: {{ $.Release.Name }}
tier: laminar
{{- end -}}

{{/*
Whether laminar reads its secrets from mounted files. Renders "true" or "false"; call it
through `eq`. Takes the root context.

laminar has no secrets loader of its own, and needs none: it reads LAMINAR_DATABASE_URL_FILE
natively, and the JWKS reaches it through its laminar.env settings file (see
laminar.envFileInitContainer).
*/}}
{{- define "laminar.secretsFromFiles.enabled" -}}
{{- include "secretsFromFiles.enabled" (dict "ctx" . "component" .Values "key" "laminar") -}}
{{- end -}}

{{/*
The Secret holding the certificate a component with a jwtIssuer verifies tokens against, under
a "tls.crt" key. Call with (list $ $componentValues).
*/}}
{{- define "laminar.jwksSecretName" -}}
{{- $ := index . 0 -}}
{{- $component := index . 1 -}}
{{- $component.jwksSecretName | default (printf "%s-commander-signing-cert" $.Release.Name) -}}
{{- end -}}

{{/*
Whether a component gets its laminar.env from laminar.envFileInitContainer rather than straight
from the ConfigMap: while it reads secrets from files and has a JWKS to deliver. Renders "true"
or nothing. Call with (list $ $componentValues).
*/}}
{{- define "laminar.envFileGenerated" -}}
{{- $ := index . 0 -}}
{{- $component := index . 1 -}}
{{- if and (eq "true" (include "laminar.secretsFromFiles.enabled" $)) $component.jwtIssuer -}}
true
{{- end -}}
{{- end -}}

{{/*
Whether the chart renders the <release>-laminar-backend placeholder Secret: while laminar reads
its database connection from a file and the bootstrapper, rather than the operator, provides
that Secret. Renders "true" or nothing. Takes the root context.
*/}}
{{- define "laminar.backendSecretRendered" -}}
{{- if and (eq "true" (include "laminar.secretsFromFiles.enabled" .)) (not .Values.databaseBootstrapper.backendSecretName) -}}
true
{{- end -}}
{{- end -}}

{{/*
The env block shared by both deployments: injects LAMINAR_DATABASE_URL from the
database secret, then appends the component's own env list.
Call with (list $ $componentValues).

While laminar reads secrets from files, the connection comes from LAMINAR_DATABASE_URL_FILE
instead. laminar then uses only the file: it never falls back to LAMINAR_DATABASE_URL, does not
start if the file is missing or empty, and restarts itself when the file changes. The JWKS goes
in the generated laminar.env instead of LAMINAR_JWKS (see laminar.envFileInitContainer).
*/}}
{{- define "laminar.env" -}}
{{- $ := index . 0 -}}
{{- $component := index . 1 -}}
{{- $secretsFromFiles := eq "true" (include "laminar.secretsFromFiles.enabled" $) -}}
{{- if $component.jwtIssuer }}
- name: LAMINAR_JWT_ISSUER
  value: {{ $component.jwtIssuer | quote }}
- name: LAMINAR_JWT_AUDIENCE
  value: {{ $component.jwtAudience | quote }}
{{- if not $secretsFromFiles }}
- name: LAMINAR_JWKS
  valueFrom:
    secretKeyRef:
      name: {{ include "laminar.jwksSecretName" (list $ $component) }}
      key: tls.crt
{{- end }}
{{- else }}
- name: LAMINAR_JWT_ISSUER
  value: https://houston.{{ include "houston.controlPlaneBaseDomain" $ }}/v2
- name: LAMINAR_JWT_AUDIENCE
  value: laminar:api
{{- end }}
- name: LAMINAR_ENVIRONMENT
  value: apc
- name: LAMINAR_API_URL
  value: http://0.0.0.0:8000/laminar
- name: LAMINAR_KUBE_NAMESPACE
  valueFrom:
    fieldRef:
      fieldPath: metadata.namespace
{{- if $secretsFromFiles }}
- name: LAMINAR_DATABASE_URL_FILE
  value: /etc/astronomer/secrets/LAMINAR_DATABASE_URL
{{- else }}
- name: LAMINAR_DATABASE_URL
  valueFrom:
    secretKeyRef:
      name: {{ template "laminar.backend.secret" $ }}
      key: connection
{{- end }}
{{- with $component.env }}
{{ toYaml . }}
{{- end }}
{{- end -}}

{{/*
laminar.env volumeMount (mounted read-only at /laminar.env): the generated file while
laminar.envFileGenerated, else the ConfigMap's. Call with (list $ $componentValues).
*/}}
{{- define "laminar.envVolumeMount" -}}
{{- $ := index . 0 -}}
{{- $component := index . 1 -}}
- name: {{ ternary "laminar-env-file" "laminar-env" (eq "true" (include "laminar.envFileGenerated" (list $ $component))) }}
  mountPath: /laminar.env
  subPath: laminar.env
  readOnly: true
{{- end -}}

{{/*
The volumes a component reads its secrets from while laminar reads secrets from files: the
database connection and, for a component with a jwtIssuer, the JWKS certificate, plus the
memory-backed volume its generated laminar.env is written to. Renders nothing while laminar is
on environment variables. Call with (list $ $componentValues).

Only the two keys are projected: the files are named after the variables they replace, and
nothing else in either Secret reaches the pod.
*/}}
{{- define "laminar.secretsVolumes" -}}
{{- $ := index . 0 -}}
{{- $component := index . 1 -}}
{{- if eq "true" (include "laminar.secretsFromFiles.enabled" $) }}
- name: laminar-secrets
  projected:
    {{- include "astronomer.secretsFromFiles.defaultMode" $ | nindent 4 }}
    sources:
      - secret:
          name: {{ template "laminar.backend.secret" $ }}
          items:
            - key: connection
              path: LAMINAR_DATABASE_URL
      {{- if $component.jwtIssuer }}
      - secret:
          name: {{ include "laminar.jwksSecretName" (list $ $component) }}
          items:
            - key: tls.crt
              path: LAMINAR_JWKS
      {{- end }}
{{- end }}
{{- if eq "true" (include "laminar.envFileGenerated" (list $ $component)) }}
- name: laminar-env-file
  emptyDir:
    medium: Memory
    sizeLimit: 1Mi
{{- end }}
{{- end -}}

{{/*
The app container's mount of laminar-secrets. Renders nothing while laminar is on environment
variables. Takes the root context.
*/}}
{{- define "laminar.secretsVolumeMount" -}}
{{- if eq "true" (include "laminar.secretsFromFiles.enabled" .) }}
- name: laminar-secrets
  mountPath: /etc/astronomer/secrets
  readOnly: true
{{- end }}
{{- end -}}

{{/*
An init container that writes a component's laminar.env: the ConfigMap's file, then the JWKS
certificate as a laminar_jwks setting (files/write-laminar-env.sh). Rendered while
laminar.envFileGenerated.

laminar reads its JWKS only from its settings, which come from laminar.env as well as the
environment, and laminar.env takes precedence. So this delivers the certificate without an
environment variable, and nothing in the environment can override it. The file goes to a
memory-backed volume, and the app container mounts it at /laminar.env in place of the
ConfigMap's. Same image and securityContext as the app container, so the 0600 file it writes
is readable by the app and nobody else.

Takes the root context.
*/}}
{{- define "laminar.envFileInitContainer" -}}
- name: laminar-env
  image: {{ include "laminar.image" . }}
  imagePullPolicy: {{ .Values.images.laminar.pullPolicy }}
  securityContext: {{- include "platform.containerSecurityContext" (list $ nil) | nindent 4 }}
  resources: {{- toYaml .Values.apiServer.resources | nindent 4 }}
  command:
    - /bin/sh
    - -c
    - |
      {{- .Files.Get "files/write-laminar-env.sh" | trim | nindent 6 }}
    - write-laminar-env
    - /etc/laminar/config/laminar.env
    - /etc/astronomer/secrets/LAMINAR_JWKS
    - /etc/laminar/env/laminar.env
  volumeMounts:
    - name: laminar-env
      mountPath: /etc/laminar/config
      readOnly: true
    - name: laminar-secrets
      mountPath: /etc/astronomer/secrets
      readOnly: true
    - name: laminar-env-file
      mountPath: /etc/laminar/env
{{- end -}}

{{/*
laminar.env volume.
*/}}
{{- define "laminar.envVolume" -}}
- name: laminar-env
  configMap:
    name: {{ .Release.Name }}-{{ .Values.envConfigMap.name }}
{{- end -}}


{{ define "dbBootstrapper.image" -}}
{{- if .Values.global.privateRegistry.enabled -}}
{{ .Values.global.privateRegistry.repository }}/ap-db-bootstrapper:{{ .Values.images.dbBootstrapper.tag }}
{{- else -}}
{{ .Values.images.dbBootstrapper.repository }}:{{ .Values.images.dbBootstrapper.tag }}
{{- end }}
{{- end }}

{{ define "laminar.dbBootstrapper.dbName" -}}
{{- if .Values.databaseBootstrapper.dbName -}}
{{ .Values.databaseBootstrapper.dbName | quote -}}
{{- else -}}
{{ .Release.Name }}-laminar
{{- end -}}
{{- end -}}

{{/*
Database bootstrapper, as an init container on each laminar component.

An init container rather than a helm hook, for the reason houston-deployment.yaml uses the same
shape: this creates the database and writes the <release>-laminar-backend secret that laminar's
own containers read, and a hook cannot be ordered to do that. Run pre-install it precedes the
platform database it needs to connect to; run post-install the containers waiting on its secret
are already blocking the install.

As an init container the ordering is a property of the pod rather than of the release, so it
holds on a first install and an upgrade alike. It runs on every pod start, so it has to stay
idempotent, which is the same contract houston's copy already has.
*/}}
{{- define "laminar.bootstrapperInitContainer" -}}
- name: laminar-bootstrapper
  image: {{ template "dbBootstrapper.image" . }}
  imagePullPolicy: {{ .Values.images.dbBootstrapper.pullPolicy }}
  securityContext: {{- include "platform.containerSecurityContext" (list $ nil) | nindent 4 }}
  resources: {{- toYaml .Values.apiServer.resources | nindent 4 }}
  env:
    {{- include "astronomer.dbBootstrapper.secretEnv" . | nindent 4 }}
    - name: DB_NAME
      value: {{ template "laminar.dbBootstrapper.dbName" . }}
    - name: SECRET_NAME
      value: {{ template "laminar.backend.secret" . }}
    {{- if and .Values.global.ssl.enabled .Values.global.ssl.mode }}
    - name: SSLMODE
      value: {{ .Values.global.ssl.mode }}
    {{- end }}
    - name: NAMESPACE
      value: {{ .Release.Namespace }}
    - name: IN_CLUSTER
      value: "true"
  {{- if eq "true" (include "astronomer.dbBootstrapper.secretsFromFiles.enabled" .) }}
  volumeMounts:
    {{- include "astronomer.dbBootstrapper.secretVolumeMount" . | nindent 4 }}
  {{- end }}
{{- end }}

{{- define "laminar.sslCertCopierInitContainer" -}}
- name: etc-ssl-certs-copier
  image: {{ include "laminar.image" . }}
  imagePullPolicy: {{ .Values.images.laminar.pullPolicy }}
  securityContext: {{- include "platform.containerSecurityContext" (list $ nil) | nindent 4 }}
  resources: {{- toYaml .Values.apiServer.resources | nindent 4 }}
  command:
    - sh
    - -c
    - |
      if [ -d /etc/ssl/certs ]; then
        cp -r /etc/ssl/certs/* /etc/ssl/certs_copy/
      else
        echo "No /etc/ssl/certs directory found, skipping copy."
      fi
  volumeMounts:
    - name: etc-ssl-certs
      mountPath: /etc/ssl/certs_copy
{{- end }}

{{/*
The secret holding laminar's database connection, under a "connection" key.

The same value names the secret and decides whether the chart creates it, so that a supplied
secret is the one laminar reads. Two separate values cannot be kept in agreement by the customer:
naming one without the other leaves laminar waiting on a secret nothing creates.
*/}}
{{ define "laminar.backend.secret" -}}
{{ default (printf "%s-laminar-backend" .Release.Name) .Values.databaseBootstrapper.backendSecretName }}
{{- end }}

{{- define "laminar.baseDomain" -}}
{{- if and (eq .Values.global.plane.mode "data") .Values.global.plane.domainPrefix -}}
{{ .Values.global.plane.domainPrefix }}.{{ .Values.global.baseDomain }}
{{- else -}}
{{ .Values.global.baseDomain }}
{{- end }}
{{- end -}}

{{- define "laminar.custom_ca_volume_mounts" }}
{{ if .Values.global.privateCaCerts }}
{{- range $secret_name := (.Values.global.privateCaCerts) }}
- name: {{ $secret_name }}
  mountPath: /usr/local/share/ca-certificates/{{ $secret_name }}.crt
  subPath: cert.pem
{{- end }}
{{- end }}
{{- end }}

{{- define "laminar.custom_ca_volumes"}}
{{ if .Values.global.privateCaCerts }}
{{- range .Values.global.privateCaCerts }}
- name: {{ . }}
  secret:
    secretName: {{ . }}
{{- end }}
{{- end }}
{{- end }}

{{/*
Checksum of the JWKS cert laminar reads, so a regenerated cert rolls the pods.
Call with (list $ $componentValues).
*/}}
{{- define "laminar.jwksChecksum" -}}
{{- $ := index . 0 -}}
{{- $component := index . 1 -}}
{{- if $component.jwtIssuer -}}
{{- $name := include "laminar.jwksSecretName" (list $ $component) -}}
{{- $data := (get ((lookup "v1" "Secret" $.Release.Namespace $name) | default dict) "data") | default dict -}}
checksum/commander-jwks-secret: {{ (get $data "tls.crt") | b64dec | sha256sum }}
{{- end -}}
{{- end -}}
