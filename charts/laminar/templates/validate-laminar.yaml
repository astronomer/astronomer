{{- /*
Laminar pull secret validation.

Laminar's images are private, so a pod with no pull secret is an ImagePullBackOff rather than a
running deployment. This fails `helm template` / `helm upgrade` fast with a clear message instead.
It emits no Kubernetes object.

The check is the rendered output of the laminar.imagePullSecrets helper rather than on the value it
supplies. The helper runs its own value precedence logic and we do not want to replicate that logic
here and risk it diverging in the future. An empty render means neither of the two possible sources 
in the helper supplied a secret.
in the helper supplied a secret.

Gated on laminar.enabled, not on global.laminar.enabled: laminar is enabled chart-wide but only
runs on a data/unified plane, and a control plane renders no laminar pod to pull an image.
*/ -}}
{{- if and (eq (include "laminar.enabled" .) "true") (not (include "laminar.imagePullSecrets" .)) }}
{{- fail "laminar is enabled but has no image pull secret. Set laminar.imagePullSecrets, or enable global.privateRegistry with a secretName." }}
{{- end }}
