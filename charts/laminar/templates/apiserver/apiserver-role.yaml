##########################
## Laminar API Server RBAC ##
##########################
{{- if eq (include "laminar.enabled" .) "true" }}
{{- if .Values.global.rbac.enabled }}
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: laminar-apiserver
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laminar.labels" (list $ "apiserver") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: laminar-apiserver
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laminar.labels" (list $ "apiserver") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: laminar-apiserver
subjects:
  - kind: ServiceAccount
    name: {{ include "laminar.serviceAccountName" (list $ "api-server") }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
