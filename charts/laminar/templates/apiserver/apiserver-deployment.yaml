##########################
## Laminar API Server ##
##########################
{{- if eq (include "laminar.enabled" .) "true" }}
{{- $secretsFromFiles := eq "true" (include "laminar.secretsFromFiles.enabled" .) }}
{{- /* apiServer.env reaches only the laminar-apiserver container, verbatim. laminar's settings
       match names in any case, so the guard does too. */}}
{{- include "secretsFromFiles.assertNoSecretEnv" (dict "enabled" $secretsFromFiles "env" .Values.apiServer.env "listKey" "laminar.apiServer.env" "names" (list "LAMINAR_DATABASE_URL" "LAMINAR_JWKS") "key" "laminar" "component" "laminar" "raw" true "caseInsensitive" true "consequence" "an entry here would put it back in laminar's environment") }}
{{- $bootstrapper := not .Values.databaseBootstrapper.backendSecretName }}
{{- $envFile := eq "true" (include "laminar.envFileGenerated" (list $ .Values.apiServer)) }}
kind: Deployment
apiVersion: apps/v1
metadata:
  name: {{ include "laminar.fullname" (list $ "api-server") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laminar.labels" (list $ "apiserver") | nindent 4 }}
spec:
  progressDeadlineSeconds: {{ .Values.apiServer.progressDeadlineSeconds }}
  replicas: {{ .Values.apiServer.replicas }}
  selector:
    matchLabels:
      {{- include "laminar.selectorLabels" (list $ "apiserver") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "laminar.selectorLabels" (list $ "apiserver") | nindent 8 }}
        {{- include "global.podLabels" . | nindent 8 }}
      {{- if .Values.global.podAnnotations }}
      annotations:
        {{- toYaml .Values.global.podAnnotations | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: Always
      serviceAccountName: {{ include "laminar.serviceAccountName" (list $ "api-server") }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      nodeSelector: {{ toYaml (default .Values.global.platformNodePool.nodeSelector .Values.nodeSelector) | nindent 8 }}
      affinity: {{ toYaml (default .Values.global.platformNodePool.affinity .Values.affinity) | nindent 8 }}
      tolerations: {{ toYaml (default .Values.global.platformNodePool.tolerations .Values.tolerations) | nindent 8 }}
      securityContext: {{- include "platform.podSecurityContext" (list $ (include "astronomer.secretsFromFiles.podSecurityContextOverride" (dict "ctx" $ "component" .Values "key" "laminar" "dbBootstrapper" $bootstrapper) | fromYaml)) | nindent 8 }}
      {{- include "laminar.imagePullSecrets" . | nindent 6 }}
      {{- if or $bootstrapper $envFile }}
      initContainers:
        {{- if $bootstrapper }}
        {{- include "laminar.bootstrapperInitContainer" . | nindent 8 }}
        {{- if eq (include "laminar.backendSecretRendered" .) "true" }}
        {{- include "astronomer.waitForSecretFile" (dict "ctx" $ "image" (include "laminar.image" .) "pullPolicy" .Values.images.laminar.pullPolicy "resources" .Values.apiServer.resources "volume" "laminar-secrets" "path" "/etc/astronomer/secrets/LAMINAR_DATABASE_URL") | nindent 8 }}
        {{- end }}
        {{- include "laminar.sslCertCopierInitContainer" . | nindent 8 }}
        {{- end }}
        {{- if $envFile }}
        {{- include "laminar.envFileInitContainer" . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: laminar-apiserver
          image: {{ include "laminar.image" . }}
          imagePullPolicy: {{ .Values.images.laminar.pullPolicy }}
          securityContext: {{- include "platform.containerSecurityContext" (list $ nil) | nindent 12 }}
          command:
          - sh
          - -c
          - |
            update-ca-certificates; python -m laminar api-server
          resources: {{- toYaml .Values.apiServer.resources | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.apiServer.port }}
          env:
            {{- if .Values.global.privateCaCerts }}
            - name: SSL_CERT_DIR
              value: /etc/ssl/certs
            {{- end }}
            {{- include "laminar.env" (list $ .Values.apiServer) | nindent 12 }}
          {{- with .Values.apiServer.livenessProbe }}
          livenessProbe: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.apiServer.readinessProbe }}
          readinessProbe: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.apiServer.startupProbe }}
          startupProbe: {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: etc-ssl-certs
              mountPath: /etc/ssl/certs
            - mountPath: /tmp
              name: tmp
            {{- include "laminar.envVolumeMount" (list $ .Values.apiServer) | nindent 12 }}
            {{- include "laminar.secretsVolumeMount" . | nindent 12 }}
            {{- include "laminar.custom_ca_volume_mounts" . | indent 12  }}
            {{- if .Values.extraVolumeMounts }}
            {{- toYaml .Values.extraVolumeMounts | nindent 12 }}
            {{- end }}
      volumes:
        - name: etc-ssl-certs
          emptyDir: {}
        - emptyDir: {}
          name: tmp
        {{- include "laminar.envVolume" . | nindent 8 }}
        {{- include "laminar.secretsVolumes" (list $ .Values.apiServer) | nindent 8 }}
        {{- include "laminar.custom_ca_volumes" . | indent 8  }}
        {{- if .Values.extraVolumes }}
          {{- toYaml .Values.extraVolumes | nindent 8 }}
        {{- end }}
        {{- /* Same guard as the initContainers: only laminar-bootstrapper mounts it. */}}
        {{- if not .Values.databaseBootstrapper.backendSecretName }}
        {{- include "astronomer.dbBootstrapper.secretVolume" . | nindent 8 }}
        {{- end }}
      dnsConfig:
        options:
          - name: ndots
            value: "4"
{{- end }}
