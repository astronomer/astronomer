######################################
## Laminar api-server NetworkPolicy ##
######################################
{{- if .Values.global.networkPolicy.enabled }}
{{- if eq (include "laminar.enabled" .) "true" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "laminar.fullname" (list $ "api-server") }}-policy
  labels:
    {{- include "laminar.selectorLabels" (list $ "apiserver") | nindent 6 }}
spec:
  podSelector:
    matchLabels:
      {{- include "laminar.selectorLabels" (list $ "apiserver") | nindent 6 }}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          tier: monitoring
          component: prometheus
          release: {{ .Release.Name }}
    - podSelector:
        matchLabels:
          component: houston
          tier: astronomer
          release: {{ .Release.Name }}
    # Houston's Laminar proxy calls the public baseDomain URL, so dag-read/write traffic arrives
    # via the in-cluster ingress controller rather than Houston directly - dp on split data planes,
    # cp on unified.
    - podSelector:
        matchLabels:
          tier: nginx
          component: {{ ternary "dp-ingress-controller" "cp-ingress-controller" (eq .Values.global.plane.mode "data") }}
          release: {{ .Release.Name }}
    - podSelector:
        matchLabels:
          component: commander
          release: {{ .Release.Name }}
    {{- if eq (include "keda.workerScalingEnabled" .) "true" }}
    # Worker autoscaling: KEDA polls for the number of workers each queue needs.
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Values.global.keda.namespace }}
    {{- end }}
    ports:
    - protocol: TCP
      port: {{ .Values.apiServer.port }}
{{- end }}
{{- end }}
