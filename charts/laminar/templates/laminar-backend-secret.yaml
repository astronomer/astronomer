############################
## Laminar Backend Secret ##
############################
{{- if and (eq (include "laminar.enabled" .) "true") (eq (include "laminar.backendSecretRendered" .) "true") }}
{{- /*
  Placeholder so the Secret exists before any pod mounts it. Through secretKeyRef nothing needs
  it in advance: the laminar-bootstrapper init container inside each laminar pod creates it.
  Mounted as a volume, that deadlocks the pod: kubelet will not start any container, the
  bootstrapper included, until every Secret its volumes name exists. The bootstrapper replaces
  the sentinel with the real connection, and the pods' wait-for-secret gate holds laminar back
  until the file has it. The same shape as the FlightDeck backend Secret, for the same reasons.

  Rendered only while laminar reads its database connection from a file and no
  databaseBootstrapper.backendSecretName is set, so with file delivery off an upgrade renders
  exactly as before. Turning it on for an existing release meets a Secret the bootstrapper
  created without Helm ownership, which is what bin/adopt-bootstrap-secrets-pre-upgrade.py is
  for.

  `helm.sh/resource-policy: keep`: the Secret holds the only copy of the connection the
  bootstrapper wrote, and it must survive file delivery being turned off again or a rollback to
  a release without it.

  Refused with the chart's ArgoCD annotations on. ArgoCD renders without cluster access, so
  astronomer.bootstrapSecretConnection cannot read the live value back, and every sync re-applies
  the sentinel, as it does for the other bootstrapped Secrets. Those components read their file
  once, at start. laminar watches this one and restarts when it changes, and a container restart
  does not re-run the bootstrapper, so laminar would fail on the sentinel until its pods were
  recreated. With ArgoCD, the operator supplies the Secret through
  databaseBootstrapper.backendSecretName, and this placeholder is not rendered at all.
*/}}
{{- if .Values.global.argoCD.annotation.enabled }}
{{- fail (printf "secrets-from-files is on for laminar and global.argoCD.annotation.enabled is set, so the chart would manage the %s Secret laminar reads its database connection from. ArgoCD renders the chart without cluster access, so every sync would put the chart's placeholder back into that Secret, and laminar, which restarts when the file changes, would then fail until its pods are recreated. Set laminar.databaseBootstrapper.backendSecretName to a Secret you provide, with the connection under a \"connection\" key, or set laminar.secretsFromFiles.enabled=false to keep laminar on environment variables." (include "laminar.backend.secret" .)) }}
{{- end }}
kind: Secret
apiVersion: v1
metadata:
  name: {{ template "laminar.backend.secret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laminar.labels" (list $ "laminar") | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  connection: {{ include "astronomer.bootstrapSecretConnection" (dict "ctx" $ "name" (include "laminar.backend.secret" .)) }}
{{- end }}
