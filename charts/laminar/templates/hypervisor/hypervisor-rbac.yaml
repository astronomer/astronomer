#############################
## Laminar Hypervisor RBAC ##
#############################
{{- if eq (include "laminar.enabled" .) "true" }}
{{- if .Values.global.rbac.enabled }}
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: laminar-hypervisor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laminar.labels" (list $ "hypervisor") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
    resourceNames: ["hypervisor"]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: laminar-hypervisor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laminar.labels" (list $ "hypervisor") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: laminar-hypervisor
subjects:
  - kind: ServiceAccount
    name: {{ include "laminar.serviceAccountName" (list $ "hypervisor") }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
