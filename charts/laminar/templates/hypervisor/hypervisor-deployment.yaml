########################
## Laminar Deployment ##
########################
{{- if eq (include "laminar.enabled" .) "true" }}
{{- $secretsFromFiles := eq "true" (include "laminar.secretsFromFiles.enabled" .) }}
{{- /* hypervisor.env reaches only the laminar-hypervisor container, verbatim. laminar's settings
       match names in any case, so the guard does too. */}}
{{- include "secretsFromFiles.assertNoSecretEnv" (dict "enabled" $secretsFromFiles "env" .Values.hypervisor.env "listKey" "laminar.hypervisor.env" "names" (list "LAMINAR_DATABASE_URL" "LAMINAR_JWKS") "key" "laminar" "component" "laminar" "raw" true "caseInsensitive" true "consequence" "an entry here would put it back in laminar's environment") }}
{{- $bootstrapper := not .Values.databaseBootstrapper.backendSecretName }}
{{- $envFile := eq "true" (include "laminar.envFileGenerated" (list $ .Values.hypervisor)) }}
kind: Deployment
apiVersion: apps/v1
metadata:
  name: {{ include "laminar.fullname" (list $ "hypervisor") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laminar.labels" (list $ "hypervisor") | nindent 4 }}
spec:
  progressDeadlineSeconds: {{ .Values.hypervisor.progressDeadlineSeconds }}
  # hardcoded by design no HA support
  replicas: 1
  minReadySeconds: {{ .Values.hypervisor.minReadySeconds }}
  strategy:
    # only ever one hypervisor: multiple would all try to scale all airflows
    type: Recreate
  selector:
    matchLabels:
      {{- include "laminar.selectorLabels" (list $ "hypervisor") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "laminar.selectorLabels" (list $ "hypervisor") | nindent 8 }}
        {{- include "global.podLabels" . | nindent 8 }}
      annotations:
        {{- include "laminar.jwksChecksum" (list $ .Values.hypervisor) | nindent 8 }}
        {{- if .Values.global.podAnnotations }}
        {{- toYaml .Values.global.podAnnotations | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: Always
      serviceAccountName: {{ include "laminar.serviceAccountName" (list $ "hypervisor") }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      nodeSelector: {{ toYaml (default .Values.global.platformNodePool.nodeSelector .Values.nodeSelector) | nindent 8 }}
      affinity: {{ toYaml (default .Values.global.platformNodePool.affinity .Values.affinity) | nindent 8 }}
      tolerations: {{ toYaml (default .Values.global.platformNodePool.tolerations .Values.tolerations) | nindent 8 }}
      securityContext: {{- include "platform.podSecurityContext" (list $ (include "astronomer.secretsFromFiles.podSecurityContextOverride" (dict "ctx" $ "component" .Values "key" "laminar" "dbBootstrapper" $bootstrapper) | fromYaml)) | nindent 8 }}
      {{- include "laminar.imagePullSecrets" . | nindent 6 }}
      {{- if or $bootstrapper $envFile }}
      initContainers:
        {{- if $bootstrapper }}
        {{- include "laminar.bootstrapperInitContainer" . | nindent 8 }}
        {{- if eq (include "laminar.backendSecretRendered" .) "true" }}
        {{- include "astronomer.waitForSecretFile" (dict "ctx" $ "image" (include "laminar.image" .) "pullPolicy" .Values.images.laminar.pullPolicy "resources" .Values.apiServer.resources "volume" "laminar-secrets" "path" "/etc/astronomer/secrets/LAMINAR_DATABASE_URL") | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- if $envFile }}
        {{- include "laminar.envFileInitContainer" . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: laminar-hypervisor
          image: {{ include "laminar.image" . }}
          imagePullPolicy: {{ .Values.images.laminar.pullPolicy }}
          securityContext: {{- include "platform.containerSecurityContext" (list $ nil) | nindent 12 }}
          command:
            - "python"
            - "-m"
            - "laminar"
            - "hypervisor"
          resources: {{- toYaml .Values.hypervisor.resources | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.hypervisor.port }}
          env:
            {{- include "laminar.env" (list $ .Values.hypervisor) | nindent 12 }}
          {{- with .Values.hypervisor.livenessProbe }}
          livenessProbe: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.hypervisor.readinessProbe }}
          readinessProbe: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.hypervisor.startupProbe }}
          startupProbe: {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "laminar.envVolumeMount" (list $ .Values.hypervisor) | nindent 12 }}
            {{- include "laminar.secretsVolumeMount" . | nindent 12 }}
      volumes:
        {{- include "laminar.envVolume" . | nindent 8 }}
        {{- include "laminar.secretsVolumes" (list $ .Values.hypervisor) | nindent 8 }}
        {{- /* Same guard as the initContainers: only laminar-bootstrapper mounts it. */}}
        {{- if not .Values.databaseBootstrapper.backendSecretName }}
        {{- include "astronomer.dbBootstrapper.secretVolume" . | nindent 8 }}
        {{- end }}
      dnsConfig:
        options:
          - name: ndots
            value: "4"
{{- end }}
