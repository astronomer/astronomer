#######################################
## Elasticsearch Proxy NetworkPolicy ##
#######################################
{{- if .Values.global.networkPolicy.enabled }}
{{- if eq (include "laminar.enabled" .) "true" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "laminar.fullname" (list $ "hypervisor") }}-policy
  labels:
    {{- include "laminar.labels" (list $ "hypervisor") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "laminar.selectorLabels" (list $ "hypervisor") | nindent 6 }}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          tier: monitoring
          component: prometheus
          release: {{ .Release.Name }}
    - podSelector:
        matchLabels:
          component: houston
          tier: astronomer
          release: {{ .Release.Name }}

    ports:
    - protocol: TCP
      port: {{ .Values.hypervisor.port }}
{{- end }}
{{- end }}
