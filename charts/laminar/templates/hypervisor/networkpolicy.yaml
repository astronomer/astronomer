##############################
## Laminar  NetworkPolicy   ##
##############################
{{- if eq (include "laminar.enabled" .) "true" }}
{{- if .Values.global.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-symphony-ingress-hypervisor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laminar.labels" (list $ "hypervisor") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "laminar.selectorLabels" (list $ "hypervisor") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress: []
{{- end }}
{{- end }}
