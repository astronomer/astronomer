########################################
## Laminar Hypervisor NetworkPolicy ##
########################################
{{- if eq (include "hibernator.enabled" .) "true" }}
{{- if .Values.global.networkPolicy.enabled }}
# allow traffic from symphony ingress to the hypervisor
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-symphony-ingress-hypervisor
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hibernator.labels" (list $ "hypervisor") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hibernator.selectorLabels" (list $ "hypervisor") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: symphony
      ports:
        - protocol: TCP
          port: {{ .Values.hypervisor.port }}
{{- end }}
{{- end }}
