#####################
## laminar.env file ##
#####################
{{- if eq (include "laminar.enabled" .) "true" }}
{{- if and .Values.envConfigMap.enabled .Values.envConfigMap.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.envConfigMap.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "laminar.labels" (list $ "laminar") | nindent 4 }}
data:
  laminar.env: |
    enable_healers: False
    enable_health_incidents: False
    configmap_metrics_enabled: False
    configmap_metrics_use_informer: False
{{ .Values.envConfigMap.content | indent 4 }}
{{- end }}
{{- end }}
