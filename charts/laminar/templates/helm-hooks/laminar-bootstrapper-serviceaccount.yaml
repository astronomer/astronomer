##############################################
## Laminar DB Bootstrapper ServiceAccount   ##
##############################################
{{- if eq (include "laminar.enabled" .) "true" }}
{{- if and .Values.serviceAccount.create .Values.global.rbac.enabled (not .Values.databaseBootstrapper.backendSecretName) (not .Values.databaseBootstrapper.backendConnection) }}
kind: ServiceAccount
apiVersion: v1
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
metadata:
  name: {{ template "laminar.bootstrapperServiceAccountName" . }}
  labels:
    tier: laminar
    component: laminar-bootstrapper
    release: {{ .Release.Name }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    heritage: {{ .Release.Service }}
    plane: {{ .Values.global.plane.mode }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-2"
  {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .Values.global.argoCD.annotation.enabled }}
    argocd.argoproj.io/sync-wave: "-1"
  {{- end }}
{{- end }}
{{- end }}
