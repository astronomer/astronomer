#########################################
## Laminar DB Bootstrapper RoleBinding ##
#########################################
{{- if eq (include "laminar.enabled" .) "true" }}
{{- if and .Values.global.rbac.enabled (not .Values.databaseBootstrapper.backendSecretName) }}
kind: RoleBinding
apiVersion: {{ template "apiVersion.rbac" . }}
metadata:
  name: {{ .Release.Name }}-laminar-bootstrapper-rolebinding
  labels:
    tier: laminar
    component: laminar-bootstrapper
    release: {{ .Release.Name }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    heritage: {{ .Release.Service }}
    plane: {{ .Values.global.plane.mode }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-2"
  {{- if .Values.global.argoCD.annotation.enabled }}
    argocd.argoproj.io/sync-wave: "-1"
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-laminar-bootstrapper-role
subjects:
  - kind: ServiceAccount
    name: {{ template "laminar.bootstrapperServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
