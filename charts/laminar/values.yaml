# Default values for the Laminar.

# Node scheduling. Defaults fall back to global.platformNodePool when unset.
nodeSelector: {}
affinity: {}
tolerations: []

# Pull secrets for the images above, as a list of {name: <secret>}.
#
# Only consulted when global.privateRegistry is off. That branch supplies its own secret, and it
# also rewrites the repository, so the two cannot be combined: use this one when the image lives
# somewhere the privateRegistry naming convention cannot express.
imagePullSecrets: []

images:
  laminar:
    repository: quay.io/astronomer/ap-laminar
    tag: 1.0.0-rc6
    pullPolicy: IfNotPresent
  dbBootstrapper:
    repository: quay.io/astronomer/ap-db-bootstrapper
    tag: 2.2.5
    pullPolicy: IfNotPresent

priorityClassName: ~

# Pod/container security contexts (rendered via platform helpers).
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 65534
podSecurityContext:
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

# -- Read laminar's secrets from mounted files instead of injecting them with
# valueFrom.secretKeyRef. Leave unset to inherit `global.secretsFromFiles.enabled`;
# set false to keep laminar on environment variables.
#
# On, both pods read the database connection from `LAMINAR_DATABASE_URL_FILE`, which
# laminar supports natively: it uses only the file, does not start if the file is
# missing or empty, and restarts itself when the file changes. laminar has no file
# setting for its JWKS, so a component with a jwtIssuer (by default only the
# hypervisor) gets an init container that writes the certificate into the laminar.env
# file laminar loads its settings from, ahead of its environment.
#
# Unless `databaseBootstrapper.backendSecretName` is set, the chart then also manages
# the `<release>-laminar-backend` Secret the bootstrapper writes. An existing release
# has that Secret without Helm ownership, so run
# `bin/adopt-bootstrap-secrets-pre-upgrade.py` before the upgrade that turns this on.
# With `global.argoCD.annotation.enabled`, the chart refuses to manage that Secret, so
# set `databaseBootstrapper.backendSecretName`: every ArgoCD sync would put the chart's
# placeholder back into it, and laminar restarts when that file changes.
# @default -- inherits global.secretsFromFiles.enabled
secretsFromFiles:
  enabled: ~

databaseBootstrapper:
  # Name of an existing secret holding the database connection for Laminar, under a "connection"
  # key. Leave unset to have the database and the secret created for you.
  backendSecretName: ~
  # Allows users to customize the database name
  dbName: ~

# ---------------------------------------------------------------------------
# laminar.env config file mounted at /laminar.env (subPath laminar.env).
# When create=true, a ConfigMap named `name` is templated from `content`.
# When create=false, an existing ConfigMap named `name` is referenced.
# Set enabled=false to skip the mount entirely.
# ---------------------------------------------------------------------------
envConfigMap:
  name: laminar-env
  content: ~

serviceAccount:
  # ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
  automountServiceAccountToken: true
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# ---------------------------------------------------------------------------
# apiServer component
# ---------------------------------------------------------------------------
apiServer:
  replicas: 2
  progressDeadlineSeconds: 1200
  port: 8000
  resources:
    requests:
      cpu: "400m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
  env: []
  livenessProbe:
    httpGet:
      port: 8000
      path: /laminar/healthz
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      port: 8000
      path: /laminar/healthz
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  startupProbe:
    httpGet:
      port: 8000
      path: /laminar/healthz
    periodSeconds: 10
    failureThreshold: 30

# ---------------------------------------------------------------------------
# hypervisor component
# ---------------------------------------------------------------------------
hypervisor:
  progressDeadlineSeconds: 1200
  minReadySeconds: 5
  port: 8000
  jwtIssuer: local
  jwtAudience: astronomer-ee
  jwksSecretName: ""
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
  env: []
  livenessProbe:
    httpGet:
      port: 8000
      path: /laminar/healthz
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      port: 8000
      path: /laminar/healthz
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  startupProbe:
    httpGet:
      port: 8000
      path: /laminar/healthz
    periodSeconds: 10
    failureThreshold: 30

extraVolumes: []
extraVolumeMounts: []
