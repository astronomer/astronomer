# https://www.python.org/dev/peps/pep-0518/#file-format

[project]
name = "apc_dev_env"
description = "Astro Private Cloud chart development environment"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=48.0",
    "deepmerge>=2.0",
    "docker>=7.1",
    "filelock>=3.30",
    "jinja2>=3.1",
    "jmespath>=1.1",
    "jsonschema>=4.26",
    "kubernetes>=34.1.0",
    "pytest>=9.1",
    "pytest-forked>=1.6",
    "pytest-pretty>=1.3",
    "pytest-profiling>=1.8",
    "pytest-rerunfailures>=16.4",
    "pytest-testinfra>=10.2",
    "pytest-xdist>=3.8",
    "pyyaml>=6.0",
    "requests>=2.34",
    "ruamel.yaml>=0.19",
    "semver>=3.0",
    "yamllint>=1.38",
]

[tool.uv]
exclude-newer = "7 days"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"

# https://docs.astral.sh/ruff/settings/
[tool.ruff]
line-length = 132
target-version = "py313"

[tool.ruff.lint]
fixable = ["ALL"]

# https://docs.astral.sh/ruff/rules/
select = [
  "ASYNC",
#  "ARG",
  "BLE",
  "C",
  "E",
  "F",
  "FLY",
  "FURB",
  "I",
#  "N",
  "PERF",
  "PGH",
#  "PL",
  "Q",
  "R",
  "RUF",
  "S",
  "UP",
  "W",
  "YTT",
]
ignore = [
  "E501",
  "RUF012",
  "S311",
  "S314",
  "S602",
  "S603",
  "S607",
  "S608",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
  "S101",
  "S105",
  "S602",
  ]
"tests/chart_tests/*" = [
  "S108",
  ]
"tests/functional_tests/test_network_security.py" = ["C901"]
"tests/chart_tests/test_private_registry.py" = ["UP031"]
"tests/chart_tests/test_pods.py" = ["UP031"]

[tool.ruff.lint.mccabe]
# TODO: reduce this
max-complexity = 14
