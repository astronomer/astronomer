# The identity KEDA presents when it asks the platform how many workers a queue needs.
# It holds no permissions of its own and nothing mounts it.
{{- if eq (include "keda.workerScalingEnabled" .) "true" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "keda.scalingIdentityName" . }}
  namespace: {{ include "keda.clusterObjectNamespace" . }}
  labels:
    {{- include "keda.scalingIdentityLabels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
