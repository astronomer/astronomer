# Lets KEDA mint a token for the scaling identity, and for no other account. A KEDA
# install grants itself no permission to mint tokens, so this is what makes it possible.
{{- if eq (include "keda.workerScalingEnabled" .) "true" }}
{{- $identity := include "keda.scalingIdentityName" . }}
apiVersion: {{ template "apiVersion.rbac" . }}
kind: Role
metadata:
  name: {{ $identity }}-token-minter
  namespace: {{ include "keda.clusterObjectNamespace" . }}
  labels:
    {{- include "keda.scalingIdentityLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: [{{ $identity | quote }}]
    verbs: ["create"]
---
apiVersion: {{ template "apiVersion.rbac" . }}
kind: RoleBinding
metadata:
  name: {{ $identity }}-token-minter
  namespace: {{ include "keda.clusterObjectNamespace" . }}
  labels:
    {{- include "keda.scalingIdentityLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $identity }}-token-minter
subjects:
  - kind: ServiceAccount
    name: {{ .Values.global.keda.operatorServiceAccountName }}
    namespace: {{ .Values.global.keda.namespace }}
{{- end }}
