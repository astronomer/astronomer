# Disables Houston's default readOnlyRootFilesystem on containers of the Airflow Deployments
# it creates.
#
# upgradeDeployments.enabled is left false (the scenario-airflow-reduce-resources.yaml-adjacent
# default): it does NOT propagate a config-only change like this one. Its Job
# (`yarn upgrade-deployments`) publishes its NATS message with no globalDeploymentsConfig at all
# (src/scripts/upgrade-deployments/index.js), and the consuming worker
# (deployment-upserted-for-update) reads globalDeploymentsConfig straight off that message with
# no fallback fetch -- so an already-existing deployment silently keeps rendering with the
# hardcoded default instead of this override, no matter how long you wait. Getting an existing
# deployment onto the new value needs an explicit upsertDeployment call instead (which DOES
# freshly fetch the current config server-side) -- see the readonly-root-*-to-* scenarios, which
# force one via a throwaway environment variable.
#
# Applied via a live `helm upgrade` of the platform release in the readonly-root-*-to-*
# scenarios (see tests/utils/helm.py), not baked into the initial install -- the upgrade path
# itself is what's under test.
astronomer:
  houston:
    upgradeDeployments:
      enabled: false
    config:
      deployments:
        securityContext:
          container:
            readOnlyRootFilesystem: false
