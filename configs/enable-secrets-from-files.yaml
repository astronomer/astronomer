############################################################################
## Turn on file-based secret loading, and switch on every component that
## participates in it.
##
## `global.secretsFromFiles.enabled` alone proves very little: most of the
## components it affects are off by default, so a default install with the flag
## on exercises only four of houston's nineteen secrets and none of the
## third-party mechanisms. This overlay enables each converted component so one
## install covers all of them.
##
## Scope note: every secret-bearing value below is a greppable dummy. The point
## is to prove the delivery mechanism, so the values only need to be present,
## distinctive, and obviously not real.
############################################################################

global:
  secretsFromFiles:
    enabled: true

  # Required whenever flightDeck is enabled against the BUNDLED dev postgres, which
  # serves no TLS. The flightdeck-bootstrapper only receives SSLMODE when both of these
  # are set (charts/astronomer/templates/commander/commander-deployment.yaml), and it uses
  # it to build the DSN it patches into the flightdeck-backend Secret. Without it the DSN
  # carries no sslmode, so Go's lib/pq applies its own default of `require` and
  # flightdeck-db-migrations dies with "pq: SSL is not enabled on the server" -- taking
  # commander with it, and then everything whose wait-for-db nc-waits on commander.
  #
  # Unrelated to secrets-from-files: the same DSN reaches the same driver on the env-var
  # path. It is latent in a default install only because flightDeck is off by default.
  ssl:
    enabled: true
    mode: "disable"
    # grafana carries its OWN sslmode, defaulting to "require", and `enabled: true`
    # above is what activates it -- so without this grafana starts asking the same
    # non-TLS postgres for SSL and dies with the identical pq error. Grafana only
    # accepts disable/require/verify-ca/verify-full, which is why it has a separate
    # key from global.ssl.mode in the first place.
    grafana:
      sslmode: "disable"

  # The standalone postgres exporter (off by default). Needed for the
  # DATA_SOURCE_PASS_FILE path below.
  prometheusPostgresExporter:
    enabled: true

  # Off by default, and the only thing that renders three of the nine houston
  # cronjobs: cleanup-task-data, populate-daily-task-metrics and
  # populate-hourly-ta-metrics.
  metricsReporting:
    taskUsageMetrics:
      enabled: true

  # The external-es-proxy subchart: the esproxy reads its credential in nginx's
  # init_by_lua, the awsproxy via a shell preamble before exec. Both are
  # chart-owned, so neither needs a rebuilt image.
  #
  # The host is deliberately unresolvable. These proxies only have to *start*
  # with credentials read from files; nothing here should depend on an
  # Elasticsearch cluster actually existing.
  customLogging:
    enabled: true
    scheme: https
    host: "elasticsearch.sff-not-a-real-host.invalid"
    secretName: "sff-es-credentials"
    awsSecretName: "sff-aws-credentials"

astronomer:
  houston:
    # Off by default; renders the check-updates cronjob.
    updateCheck:
      enabled: true

    # Operator-defined secrets, which are the only way to exercise
    # HOUSTON_SECRETS_FROM_FILES_EXTRA -- the chart cannot know these variable
    # names at build time, so it appends them to a list the loader reads.
    #
    # The names are deliberately NOT drawn from the loader's built-in
    # SECRET_ENV_VARS list. The two lists are unioned through a Set, so a
    # built-in name would still load correctly and the assertion could not tell
    # which mechanism did it. A name nothing else knows about can only have
    # arrived via EXTRA.
    secret:
      - envName: "SFF_HOUSTON_EXTRA_SECRET"
        secretName: "sff-houston-operator-secret"
        secretKey: "token"

    logging:
      # Vector audit-log sidecar. Uses Vector's own `secret` directory backend
      # and SECRET[...] interpolation, not the houston loader, so it has its own
      # toggle and its own failure modes.
      #
      # Only ONE sink can be enabled: the configmap template hard-fails with
      # "supports exactly one sink at a time". So this cannot cover both of the
      # converted sinks in a single install -- cloudwatch's AWS_ACCESS_KEY_ID /
      # AWS_SECRET_ACCESS_KEY stay render-only, and elasticsearch's ES_USERNAME /
      # ES_PASSWORD are exercised here. Both go through the identical directory
      # backend plus SECRET[...] interpolation, so proving one proves the
      # mechanism; the chart suite pins both, parametrized over api and worker.
      #
      # Elasticsearch is the one chosen because its hard-failure on an empty
      # secret file ("secret in file 'password' was empty") was verified against
      # the pinned ap-vector image, which makes a silent-empty regression
      # detectable here rather than merely absent.
      loggingSidecar:
        enabled: true
        elasticsearch:
          enabled: true
          endpoint: "https://elasticsearch.sff-not-a-real-host.invalid:9200"
          auth:
            # Only the basic strategy carries credentials to move to files.
            strategy: "basic"
            secretName: "sff-es-basic-credentials"

  navigator:
    enabled: true
    replicas: 1
    secret:
      - envName: "SFF_NAVIGATOR_EXTRA_SECRET"
        secretName: "sff-navigator-operator-secret"
        secretKey: "token"

  dpLink:
    replicas: 1
    secret:
      - envName: "SFF_DPLINK_EXTRA_SECRET"
        secretName: "sff-dplink-operator-secret"
        secretKey: "token"

  # flightDeck gates two things at once: pilot's only file-sourced secret, and
  # commander's COMMANDER_FLIGHTDECK_DSN_FILE. With it off, commander loads one
  # secret instead of two -- and an earlier revision of this feature emitted the
  # _FILE path anyway, which crash-looped commander on a default install (fixed
  # in f678e14f3). Leaving it on keeps that path covered.
  flightDeck:
    enabled: true

  pilot:
    enabled: true
    replicas: 1

prometheus-postgres-exporter:
  config:
    datasource:
      # DATA_SOURCE_PASS_FILE applies only to the split URI/USER/PASS form.
      # The default connectionSecret path uses DATA_SOURCE_NAME, which has no
      # _FILE equivalent in the postgres_exporter binary, so leaving the default
      # in place would make the toggle a silent no-op. The chart hard-fails if
      # connectionSecret and a password source are both set, so this must be
      # nulled rather than merely overridden.
      connectionSecret: ~
      host: "astronomer-postgresql.astronomer.svc.cluster.local."
      user: "postgres"
      passwordSecret:
        name: "astronomer-postgresql"
        key: "postgresql-password"
      port: "5432"
      sslmode: "disable"
