############################
## Astronomer configuration
## For local Kubernetes development
## There should be an A record on *.localtest.me
## with the value 127.0.0.1 and you should set up
## the secrets and TLS cert normally.
############################

tags:
  platform: true
  logging: false
  monitoring: false
  postgresql: true
  nats: true

global:
  helmRepo: "https://internal-helm.astronomer.io"
  # Base domain for all subdomains exposed through ingress
  baseDomain: localtest.me
  # Mode of the plane, can be 'data', 'unified' or 'local'
  plane:
    domainPrefix: "local"

  # Name of secret containing TLS certificate
  tlsSecret: astronomer-tls
  postgresql:
    enabled: true
  nats:
    replicas: 1
    enabled: true
  stan:
    replicas: 1
    enabled: true
  ssl:
    enabled: false
  # Custom CA TLS certificates. Each secret must have one data entry 'cert.pem'.
  # mkcert-root-ca (bin/setup-kind.py) is mkcert's own root CA -- the same CA that signs
  # astronomer-tls above -- so the platform trusts its own dev TLS chain. This is the same
  # secret name/content/mechanism the k3d CP/DP topology uses (bin/setup-cp-dp-k3d.py's
  # --mkcert-root-ca-secret-name, default mkcert-root-ca) -- keep the two in sync; do not
  # reintroduce a separately-named KIND-only secret here (see PR #3494 / commit 11c238ebd for
  # the regression that shipped from having two names for this one concept).
  privateCaCerts:
    - mkcert-root-ca
  deployMechanisms:
    dagOnlyDeployment:
      enabled: true

nats:
  cluster:
    enabled: false
    replicas: 1
  resources: {}

stan:
  stan:
    replicas: 1
  store:
    cluster:
      enabled: false
  resources: {}

############################
## Astronomer configuration
## Omit resource requests
############################
astronomer:
  astroUI:
    replicas: 1
    resources:
      requests:
        cpu: "0m"
        memory: "0Mi"
  houston:
    replicas: 1
    worker:
      replicas: 1
    resources:
      requests:
        cpu: "0m"
        memory: "0Mi"

    config:
      emailConfirmation:
        enabled: false
      auth:
        local:
          enabled: true
      deployments:
        logHelmValues:
          enabled: true
        deployMechanisms:
          dagOnlyDeployment:
            enabled: true
          gitSyncDagDeployment:
            enabled: true
          configureDagDeployment:
            enabled: true
        runtimeManagement:
          airflowV3:
            enabled: true
            minimumAstroRuntimeVersion: "3.1-2"
          listAllRuntimeVersions:
            enabled: true
  commander:
    replicas: 1
    resources:
      requests:
        cpu: "0m"
        memory: "0Mi"
  registry:
    resources:
      requests:
        cpu: "0m"
        memory: "0Mi"
  install:
    resources:
      requests:
        cpu: "0m"
        memory: "0Mi"

#################################
## Nginx configuration
#################################
nginx:
  replicas: 1
  replicasDefaultBackend: 1
  # Configure resources
  resources:
    requests:
      cpu: "500m"
      memory: "1024Mi"
    limits:
      cpu: "1"
      memory: "2048Mi"

#################################
## Grafana configuration
#################################
grafana:
  # Configure resources
  resources:
    requests:
      cpu: "0m"
      memory: "0Mi"

#################################
## Prometheus configuration
#################################
prometheus:
  replicas: 1
  # Configure resources
  resources:
    requests:
      cpu: "0m"
      memory: "0Gi"

prometheus-postgresql-exporter:
  replicaCount: 1
  # Configure resources
  resources:
    requests:
      cpu: "0m"
      memory: "0Gi"

#################################
## Elasticsearch configuration
#################################
elasticsearch:
  # Configure client nodes
  client:
    replicas: 1
    resources:
      requests:
        cpu: "0"
        memory: "0Gi"

  # Configure data nodes
  data:
    replicas: 1
    resources:
      requests:
        cpu: "0"
        memory: "0"

  # Configure master nodes
  master:
    replicas: 1
    resources:
      requests:
        cpu: "0"
        memory: "0Gi"

#################################
## Kube State configuration
#################################
kubeState:
  # Configure resources
  resources:
    requests:
      cpu: "0m"
      memory: "0Mi"
